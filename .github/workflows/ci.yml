name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lines `engines` in package.json allows; each resolves to its newest release, inside the range.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run prettier

      - run: npm run test:front

      # test:back loads better-sqlite3 inside Electron (as Node, no display), so it is built for Electron's ABI first.
      - run: npm run rebuild:electron

      - run: npm run test:back
