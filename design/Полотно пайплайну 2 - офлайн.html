isten <span style=\"background:#38a3ff22;border-radius:3px;padding:1px 0\">EADDRINUSE<\u002Fspan>: address already in use :::5173…<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:baseline;gap:7px;padding:7px 2px 0\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;flex-shrink:0\">УЧОРА 16:20<\u002Fspan><span style=\"font-size:11px;line-height:1.4;color:#6b7490;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0\">Чому не стартує dev-сервер<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:9px 11px\"><div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#e8c46a\">TESTER<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#5c6478\">КРОК 1 · 16:20<\u002Fspan><\u002Fdiv><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.55;color:#dde1ee;text-wrap:pretty\">node:events:496 throw er; // Unhandled <span style=\"background:#38a3ff22;border-radius:3px;padding:1px 0\">EADDRINUSE<\u002Fspan>…<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:5px;padding-top:2px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">КОМАНДА Й ЇЇ ВИВІД — ТАКИЙ САМИЙ ТЕКСТ ДЛЯ ПОШУКУ, ЯК ТЕКСТ КРОКУ: ОДНЕ ПРАВИЛО НА ВСЕ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">МОНО — ЄДИНИЙ ЗНАК, ЩО УРИВОК ІЗ ВИКЛИКУ; ІМ'Я ВИКЛИКУ ОКРЕМО НЕ ПИШЕТЬСЯ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ДВА МІСЦЯ В ОДНОМУ КРОЦІ (КОМАНДА Й ЇЇ ВИВІД) — ДВА РЯДКИ З ОДНАКОВИМ «КРОК N», І ЦЕ ПРАВИЛЬНО: МІСЦЕ МІРЯЄТЬСЯ ЗБІГОМ, А НЕ КРОКОМ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">КРОК ЛІЧИТЬСЯ ЗА 23p — ЗА ХОДАМИ, ЯКІ НАГОДУВАЛИ ЦЕЙ ХІД, А НЕ ЗА ПОРЯДКОМ ЗАПИСУ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ДОВГИЙ РЯДОК ВИВОДУ РІЖЕТЬСЯ НА ДВА РЯДКИ Й НЕ ПЕРЕНОСИТЬСЯ ПОСЕРЕД ІДЕНТИФІКАТОРА<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">СТЕЛЯ Й ПОРОЖНЄ · ДВА КІНЦІ ОДНОГО ПОШУКУ<\u002Fspan><div style=\"width:380px;background:#12151f;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-sizing:border-box\"><div style=\"display:flex;align-items:center;gap:8px;background:#171b26;border:1px solid #2c3550;border-radius:9px;padding:8px 10px;box-shadow:0 0 0 2px #38a3ff44\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5c6478\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m16.5 16.5 4 4\"><\u002Fpath><\u002Fsvg><span style=\"flex:1;font-size:12px;color:#dde1ee\">ко<span style=\"display:inline-block;width:1px;height:12px;background:#38a3ff;margin-left:1px;vertical-align:-2px\"><\u002Fspan><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#6b7490;flex-shrink:0\">300 МІСЦЬ · СТЕЛЯ<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:baseline;gap:7px;padding:7px 2px 0\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;flex-shrink:0\">СЬОГОДНІ 14:12<\u002Fspan><span style=\"font-size:11px;line-height:1.4;color:#6b7490;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0\">Прибери повторні amily:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#6b7490;flex-shrink:0\">0 МІСЦЬ · 142 ЗАПУСКИ<\u002Fspan><\u002Fdiv><div style=\"padding:12px 0 14px\"><span style=\"font-size:12.5px;line-height:1.6;color:#838ba6;text-wrap:pretty\">Нічого не знайшлось: «мігра» не трапилось ні в питаннях, ні в текстах кроків, ні у викликах.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:5px;padding-top:2px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">СТЕЛЯ РІЖЕ З ПРАВИЛЬНОГО КІНЦЯ: СПЕРШУ ВЕСЬ СПИСОК ЗА ГОДИНОЮ, ПОТІМ ТРИСТА НАЙСВІЖІШИХ — А НЕ ТРИСТА ПЕРШИХ, ЩО ТРАПИЛИСЬ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">СТЕЛЯ СТОЇТЬ НА МІСЦЯХ, А НЕ НА ЗАПУСКАХ: КОРОТКЕ СЛОВО ДАЄ ДЕСЯТКИ МІСЦЬ У КОЖНОМУ ЗАПУСКУ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ПОЛЕ КАЖЕ СТЕЛЮ ТИМ САМИМ ПИСАННЯМ — «300 МІСЦЬ · СТЕЛЯ»: ЧИСЛО ЗАПУСКІВ ТУТ НЕ ПИШЕТЬСЯ, БО ВОНО ВЖЕ НЕ ПОВНЕ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">НУЛЬ — ЦЕ НЕ «ІСТОРІЯ ПОРОЖНЯ» (23h): ЗАПИС НА МІСЦІ, НЕ ТРАПИЛОСЬ САМЕ СЛОВО, І «0 МІСЦЬ · 142 ЗАПУСКИ» КАЖЕ РІВНО ЦЕ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ДІЇ ПІД РЕЧЕННЯМ НЕМА: ВИПРАВЛЯТИ СЛОВО РУКА ЙДЕ В ПОЛЕ, ЯКЕ ЗА КРОК ВИЩЕ Й ПІД КАРЕТКОЮ<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"23x\" style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:baseline;gap:12px;max-width:1100px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:#38a3ff;background:#12151f;border:1px solid #262b3a;border-radius:6px;padding:3px 8px;flex-shrink:0\">23x<\u002Fspan><span style=\"font-size:15px;font-weight:600;flex-shrink:0\">Рядок знайденого місця й риска зміни · деталь <a href=\"#23t\">23t<\u002Fa><\u002Fspan><span style=\"font-size:13px;line-height:1.6;color:#838ba6;text-wrap:pretty\">Рядок місця — не маленький рядок запуску, а <b style=\"color:#dde1ee;font-weight:600\">адреса одного повідомлення<\u002Fb>, і в неї чотири речі: ім'я агента своїм кольором, крок, година цього повідомлення й самі знайдені слова. Крок тієї ж природи, що й година — він про повідомлення, а не про запуск, — і пара «КРОК 2 · 14:12» уже є готовою фразою застосунку: картка ходу в потоці підписана рівно так само (<a href=\"#23e\">23e<\u002Fa>, <a href=\"#23m\">23m<\u002Fa>), тому рядок пошуку читається тим самим складом, що й місце, куди він веде; лічиться крок за <a href=\"#23p\">23p<\u002Fa> — за ходами, які нагодували цей хід. Усе інше врізано за одним правилом: <b style=\"color:#dde1ee;font-weight:600\">факти про запуск не повторюються на кожному його місці<\u002Fb>. Рівний список за годиною забрав риску-групу, а разом із нею й адресу запуску, і рядок сам її не несе — писати питання у восьми рядках означало б вернути ту саму біду, з якої почалась урізана картка. Тому адреса з'являється <b style=\"color:#dde1ee;font-weight:600\">на зміні<\u002Fb>: тиха риска стоїть лише там, де попередній рядок був з іншого запуску. Це не група — вона нічого не збирає й не переставляє, порядок лишається чисто за годиною; репліки одного запуску йдуть хвилинами одна по одній, тож на живому записі риска каже раз на купку, а коли два запуски переплелись, той самий запуск називається вдруге, і це правильно: питання «де я зараз» виникає щоразу, як запис перескочив.<\u002Fspan><\u002Fdiv>\n<div style=\"width:1266px;flex-shrink:0;background:#262b3a;background-image:radial-gradient(circle, rgba(255,255,255,0.14) 1px, transparent 1px);background-size:8px 8px;background-position:3px 3px;padding:35px;display:flex;gap:28px;box-sizing:border-box;border-radius:4px;align-items:flex-start\"><div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">АДРЕСА ПОВІДОМЛЕННЯ · ЧОТИРИ РЕЧІ<\u002Fspan><div style=\"width:380px;background:#12151f;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-sizing:border-box\"><div style=\"display:flex;align-items:baseline;gap:7px;padding:7px 2px 0\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;flex-shrink:0\">СЬОГОДНІ 14:12<\u002Fspan><span style=\"font-size:11px;line-height:1.4;color:#6b7490;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0\">Прибери повторні запити до бази у профілі<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:9px 11px\"><div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#e8c46a\">TESTER<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#5c6478\">КРОК 2 · 14:12<\u002Fspan><\u002Fdiv><span style=\"font-size:12.5px;line-height:1.5;color:#dde1ee;text-wrap:pretty\">Поклав <span style=\"background:#38a3ff22;border-radius:3px;padding:1px 0\">кеш<\u002Fspan>ування у fetchUser: ключ — ідентифікатор користувача, час життя п'ять хвилин…<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;padding:10px 0 2px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490\">ЛИШИЛОСЬ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ІМ'Я АГЕНТА СВОЇМ КОЛЬОРОМ · КРОК · ГОДИНА ЦЬОГО ПОВІДОМЛЕННЯ · САМІ ЗНАЙДЕНІ СЛОВА<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490;padding-top:4px\">ПІШЛО<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">КРАПКА Й СЛОВО СТАНУ · ТРИВАЛІСТЬ · «N КРОКІВ · СУМА» · ХРЕСТИК<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:5px;padding-top:2px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">УСІ ЧОТИРИ — ПРО ОДНЕ ПОВІДОМЛЕННЯ, А НЕ ПРО ЗАПУСК, І САМЕ ТОМУ СТОЯТЬ: КРОК ТІЄЇ Ж ПРИРОДИ, ЩО Й ГОДИНА<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">«КРОК 2 · 14:12» — ГОТОВА ФРАЗА ЗАСТОСУНКУ: КАРТКА ХОДУ В ПОТОЦІ ПІДПИСАНА РІВНО ТАК САМО (23e, 23m), ТОМУ РЯДОК ЧИТАЄТЬСЯ ТИМ САМИМ СКЛАДОМ, ЩО Й МІСЦЕ, КУДИ ВІН ВЕДЕ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">КРОК ЛІЧИТЬСЯ ЗА 23p — ЗА ХОДАМИ, ЯКІ НАГОДУВАЛИ ЦЕЙ ХІД, А НЕ ЗА ПОРЯДКОМ ЗАПИСУ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ФАКТИ ПРО ЗАПУСК НЕ ПОВТОРЮЮТЬСЯ НА КОЖНОМУ ЙОГО МІСЦІ: ВІСІМ КОПІЙ «ГОТОВО» ПОХОВАЛИ Б ТЕ ЄДИНЕ, ЩО РЯДКИ РІЗНИТЬ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ХРЕСТИКА НЕМА НАВМИСНО: ВІН ЗАБИРАЄ ВЕСЬ ЗАПИС ЗАПУСКУ (23f), А НА КАРТЦІ, СХОЖІЙ НА ОДНЕ ПОВІДОМЛЕННЯ, ЦЕ ПАСТКА — ВИДАЛЯЮТЬ У СПИСКУ, ЩО ВЕРТАЄТЬСЯ, ЩОЙНО ПОЛЕ ПОРОЖНІЄ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">РЯДОК НЕ РОСТЕ: ГОЛОВА В ОДИН РЯДОК І ТЕКСТ У ДВА — НИЖЧИЙ ЗА РЯДОК ЗАПУСКУ, ТОМУ СОРОК МІСЦЬ ГОРТАЮТЬСЯ, А НЕ ЗАВАЛЮЮТЬ СПИСОК<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">ЧОМУ РИСКА, А НЕ ГРУПА<\u002Fspan><div style=\"width:380px;background:#12151f;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-sizing:border-box\"><div style=\"display:flex;align-items:baseline;gap:7px;padding:7px 2px 0\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;flex-shrink:0\">СЬОГОДНІ 14:12<\u002Fspan><span style=\"font-size:11px;line-height:1.4;color:#6b7490;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0\">Прибери повторні запити до бази у профілі<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:9px 11px\"><div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#b18aff\">EDITOR<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#5c6478\">КРОК 6 · 14:27<\u002Fspan><\u002Fdiv><span style=\"font-size:12.5px;line-height:1.5;color:#dde1ee;text-wrap:pretty\">Додав скидання <span style=\"background:#38a3ff22;border-radius:3px;padding:1px 0\">кеш<\u002Fspan>у в logout — тест зелений.<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:baseline;gap:7px;padding:7px 2px 0\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;flex-shrink:0\">СЬОГОДНІ 11:40<\u002Fspan><span style=\"font-size:11px;line-height:1.4;color:#6b7490;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0\">Перевір, чи не тримає кеш старі сесії<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:9px 11px\"><div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#b18aff\">EDITOR<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#5c6478\">КРОК 3 · 14:18<\u002Fspan><\u002Fdiv><span style=\"font-size:12.5px;line-height:1.5;color:#dde1ee;text-wrap:pretty\"><span style=\"background:#38a3ff22;border-radius:3px;padding:1px 0\">Кеш<\u002Fspan> не тримає старих сесій — перевірив три ключі…<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:baseline;gap:7px;padding:7px 2px 0\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;flex-shrink:0\">СЬОГОДНІ 14:12<\u002Fspan><span style=\"font-size:11px;line-height:1.4;color:#6b7490;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0\">Прибери повторні запити до бази у профілі<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:9px 11px\"><div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#8fd18b\">LINTER<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#5c6478\">КРОК 4 · 14:16<\u002Fspan><\u002Fdiv><span style=\"font-size:12.5px;line-height:1.5;color:#dde1ee;text-wrap:pretty\">Назва <span style=\"background:#38a3ff22;border-radius:3px;padding:1px 0\">кеш<\u002Fspan>Профілю не збігається з рештою модуля…<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:5px;padding-top:2px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">РІВНИЙ СПИСОК ЗАБРАВ АДРЕСУ ЗАПУСКУ, І РЯДОК САМ ЇЇ НЕ НЕСЕ: ІМ'Я, КРОК І ГОДИНА КАЖУТЬ ПРО ПОВІДОМЛЕННЯ, А НЕ ПРО ТЕ, ЯКОГО ВОНО ЗАПУСКУ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ПИСАТИ ПИТАННЯ В КОЖНОМУ РЯДКУ НЕ ВИХІД: ВІСІМ КОПІЙ ОДНОГО ПИТАННЯ — ТА САМА БІДА, З ЯКОЇ ПОЧАЛАСЬ УРІЗАНА КАРТКА<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ТОМУ АДРЕСА ЗЯВЛЯЄТЬСЯ НА ЗМІНІ: РИСКА СТОЇТЬ ЛИШЕ ТАМ, ДЕ ПОПЕРЕДНІЙ РЯДОК БУВ З ІНШОГО ЗАПУСКУ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ЦЕ НЕ ГРУПА: ВОНА НІЧОГО НЕ ЗБИРАЄ Й НЕ ПЕРЕСТАВЛЯЄ — ПОРЯДОК ЛИШАЄТЬСЯ ЧИСТО ЗА ГОДИНОЮ, А РИСКА ЛИШЕ ЧИТАЄ ЙОГО<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">РЕПЛІКИ ОДНОГО ЗАПУСКУ ЗАЗВИЧАЙ ІДУТЬ ХВИЛИНАМИ ОДНА ПО ОДНІЙ, ТОМУ НА ЖИВОМУ ЗАПИСІ РИСКА КАЖЕТЬСЯ РАЗ НА КУПКУ, А НЕ РАЗ НА РЯДОК<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">КОЛИ ДВА ЗАПУСКИ ПЕРЕПЛЕЛИСЬ, ТОЙ САМИЙ ЗАПУСК НАЗИВАЄТЬСЯ ВДРУГЕ — І ЦЕ ПРАВИЛЬНО: ПИТАННЯ «ДЕ Я ЗАРАЗ» ВИНИКАЄ ЩОРАЗУ, ЯК ЗАПИС ПЕРЕСКОЧИВ<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">ЩО ЧИТАЄТЬСЯ, КОЛИ ЗАПУСК ОДИН<\u002Fspan><div style=\"width:380px;background:#12151f;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-sizing:border-box\"><div style=\"display:flex;align-items:center;gap:8px;background:#171b26;border:1px solid #2c3550;border-radius:9px;padding:8px 10px;box-shadow:0 0 0 2px #38a3ff44\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5c6478\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m16.5 16.5 4 4\"><\u002Fpath><\u002Fsvg><span style=\"flex:1;font-size:12px;color:#dde1ee\">кеш<span style=\"display:inline-block;width:1px;height:12px;background:#38a3ff;margin-left:1px;vertical-align:-2px\"><\u002Fspan><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#6b7490;flex-shrink:0\">40 МІСЦЬ · 3 ЗАПУСКИ<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:baseline;gap:7px;padding:7px 2px 0\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;flex-shrink:0\">СЬОГОДНІ 14:12<\u002Fspan><span style=\"font-size:11px;line-height:1.4;color:#6b7490;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0\">Прибери повторні запити до бази у профілі<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:9px 11px\"><div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#b18aff\">EDITOR<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#5c6478\">КРОК 6 · 14:27<\u002Fspan><\u002Fdiv><span style=\"font-size:12.5px;line-height:1.5;color:#dde1ee;text-wrap:pretty\">Додав скидання <span style=\"background:#38a3ff22;border-radius:3px;padding:1px 0\">кеш<\u002Fspan>у в logout — тест зелений.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:9px 11px\"><div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#6fd3d8\">REVIEWER<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#5c6478\">КРОК 5 · 14:24<\u002Fspan><\u002Fdiv><span style=\"font-size:12.5px;line-height:1.5;color:#dde1ee;text-wrap:pretty\">Лишилось одне: <span style=\"background:#38a3ff22;border-radius:3px;padding:1px 0\">кеш<\u002Fspan> не чиститься на виході…<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:9px 11px\"><div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#e8c46a\">TESTER<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#5c6478\">КРОК 5 · 14:19<\u002Fspan><\u002Fdiv><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.55;color:#dde1ee;text-wrap:pretty\">redis-cli keys \"user:*\" # <span style=\"background:#38a3ff22;border-radius:3px;padding:1px 0\">кеш<\u002Fspan> після прогону<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:9px 11px\"><div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#b18aff\">EDITOR<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#5c6478\">КРОК 5 · 14:18<\u002Fspan><\u002Fdiv><span style=\"font-size:12.5px;line-height:1.5;color:#dde1ee;text-wrap:pretty\">Перейменував: <span style=\"background:#38a3ff22;border-radius:3px;padding:1px 0\">кеш<\u002Fspan>Користувача, і те саме в тестах…<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:9px 11px\"><div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#8fd18b\">LINTER<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#5c6478\">КРОК 4 · 14:16<\u002Fspan><\u002Fdiv><span style=\"font-size:12.5px;line-height:1.5;color:#dde1ee;text-wrap:pretty\">Назва <span style=\"background:#38a3ff22;border-radius:3px;padding:1px 0\">кеш<\u002Fspan>Профілю не збігається з рештою модуля…<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:9px 11px\"><div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#e8c46a\">TESTER<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#5c6478\">КРОК 3 · 14:15<\u002Fspan><\u002Fdiv><span style=\"font-size:12.5px;line-height:1.5;color:#dde1ee;text-wrap:pretty\">…другий запит уже читає <span style=\"background:#38a3ff22;border-radius:3px;padding:1px 0\">кеш<\u002Fspan>, а не базу.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:9px 11px\"><div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#b18aff\">EDITOR<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#5c6478\">КРОК 2 · 14:13<\u002Fspan><\u002Fdiv><span style=\"font-size:12.5px;line-height:1.5;color:#dde1ee;text-wrap:pretty\">Виніс <span style=\"background:#38a3ff22;border-radius:3px;padding:1px 0\">кеш<\u002Fspan> в окремий модуль…<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:9px 11px\"><div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#e8c46a\">TESTER<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#5c6478\">КРОК 2 · 14:12<\u002Fspan><\u002Fdiv><span style=\"font-size:12.5px;line-height:1.5;color:#dde1ee;text-wrap:pretty\">Поклав <span style=\"background:#38a3ff22;border-radius:3px;padding:1px 0\">кеш<\u002Fspan>ування у fetchUser: ключ — ідентифікатор користувача…<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:5px;padding-top:2px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ВІСІМ МІСЦЬ ОДНОГО ЗАПУСКУ ЙДУТЬ КУПКОЮ Й ПІД ОДНОЮ РИСКОЮ: РІВНИЙ СПИСОК ЗБИРАЄ ЇХ САМ, БЕЗ ГРУПИ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ПОРЯДОК ТУТ — ЗВОРОТНИЙ ДО ХОДУ, БО ГОДИНА НОВІША ЗГОРИ: СТАРЕ «ЗА ПОРЯДКОМ ХОДУ ВСЕРЕДИНІ ГРУПИ» СКАСОВАНЕ РАЗОМ ІЗ ГРУПАМИ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ОДНАКОВИЙ «КРОК 5» У ТРЬОХ РЯДКАХ — НЕ ЗБІЙ: ОДИН ХІД КАЖЕ КІЛЬКА РЕЧЕЙ, І КОЖНА З НИХ СВОЄ МІСЦЕ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ГОДИНА РІЗНИТЬ ТЕ, ЧОГО КРОК НЕ РІЗНИТЬ, А КРОК КАЖЕ, ДЕ ЦЕ В ХОДІ: ПОРІЗНО ЖОДНЕ З ДВОХ НЕ ДОСТАТНЄ<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<div id=\"23u\" style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:baseline;gap:12px;max-width:1100px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:#38a3ff;background:#12151f;border:1px solid #262b3a;border-radius:6px;padding:3px 8px;flex-shrink:0\">23u<\u002Fspan><span style=\"font-size:15px;font-weight:600;flex-shrink:0\">Пошук усередині потоку<\u002Fspan><span style=\"font-size:13px;line-height:1.6;color:#838ba6;text-wrap:pretty\">Пошук є й у самому потоці, і шукає по тому самому, що в історії (<a href=\"#23t\">23t<\u002Fa>) — питання, тексти кроків, виклики. Місце йому — <b style=\"color:#dde1ee;font-weight:600\">окрема смуга на всю ширину, над потоком і під смугою стану<\u002Fb>, і вона стоїть завжди, як поле над історією: рядок вкладок від пошуку не має нічого. Іконки в ньому немає й не буде — відкрите поле в реальній ширині рядка виштовхувало «+ НОВИЙ ЧАТ» у третій рядок, а рядок вкладок — не список дій. Смуга ні до чого не притулена: власної риски немає, відступ з усіх боків, тому читається як щось <b style=\"color:#dde1ee;font-weight:600\">над<\u002Fb> розмовою, а не як ще одна її смуга. Поле всередині — те саме, що в історії, до пікселя: один пошук по одному запису, сказаний на екрані двічі, не має бути двома різними речами. Скла немає зовсім — поле і є вхід, натискати нема чого; ⌘F просить каретку, Escape спорожняє поле й гасить знаки, а не забирає саме поле. Потік їде до збігу <b style=\"color:#dde1ee;font-weight:600\">на кожній набраній літері<\u002Fb>, а не на Enter. Число лічиться <b style=\"color:#dde1ee;font-weight:600\">від найсвіжішого<\u002Fb>: «1» — останнє місце, де слово сказали, бо саме туди йдуть його шукати, а хода веде в минуле. Найсвіжіше лежить унизу потоку, тож наступний збіг — вище: стрілка вгору — наступний, стрілка вниз — попередній, і з першого вона приходить у сьомий. Стрілка каже, куди поїде потік, а не куди піде число; ту саму ходу мають Enter і ⇧Enter, а хрестик прибирає слово — у потоці й в історії однаково; коли не знайшлось нічого, стрілки гаснуть до ненатискних. Місце, куди доїхали, позначене двома знаками: слово підсвічене тлом акценту, а картка тримає тонку акцентну смужку ліворуч (це inset-тінь, а не межа: справжня межа зсунула б власну межу картки на піксель, і платили б за це всі картки, яких ніхто не шукав). Смужка <b style=\"color:#dde1ee;font-weight:600\">світиться 2,4 с і гасне<\u002Fb> — завжди, хоч би як туди дійшли, натиском рядка історії (<a href=\"#23v\">23v<\u002Fa>) чи ходою по стрілці: світло, що не гасне, перестає бути світлом і стає частиною картки; де місце — вже сказала поїздка, а куди йде хода — каже число. І шукається лише те, <b style=\"color:#dde1ee;font-weight:600\">що хтось сказав<\u002Fb>: питання людини й відповідь агента. Хід, що не почався (<a href=\"#4e\">4e<\u002Fa>), слово застосунку на рисці (<a href=\"#4g\">4g<\u002Fa>), рядки передачі й копія, що прийшла лінією, — поза пошуком і без підсвітки: якщо застосунок ніколи не бере картку, то й місця в пошуку вона не бере, а підсвітити її означало б пообіцяти місце, до якого хода не веде.<\u002Fspan><\u002Fdiv>\n<div style=\"width:1220px;flex-shrink:0;background:#262b3a;background-image:radial-gradient(circle, rgba(255,255,255,0.14) 1px, transparent 1px);background-size:8px 8px;background-position:3px 3px;padding:35px;display:flex;gap:28px;box-sizing:border-box;border-radius:4px\"><div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">СМУГА ПОШУКУ · СТОЇТЬ ЗАВЖДИ, ПОЛЕ ПОРОЖНЄ<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"width:560px;background:#0d0f16;border-radius:10px;overflow:hidden\"><div style=\"display:flex;align-items:center;gap:14px;background:#12151f;border-bottom:1px solid #1c202c;padding:0 14px;height:38px;box-sizing:border-box\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#dde1ee;border-bottom:1.5px solid #38a3ff;height:100%;display:flex;align-items:center\">ПОТІК<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#5c6478;border-bottom:1.5px solid transparent;height:100%;display:flex;align-items:center\">ІСТОРІЯ<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#38a3ff\">+ НОВИЙ ЧАТ<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:center;gap:8px;background:#12151f;border-bottom:1px solid #1c202c;padding:0 14px;height:30px;box-sizing:border-box\"><span style=\"width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade80\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#5c6478\">ІДЕ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#e8c46a\">TESTER<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#4a5164\">КРОК 3<\u002Fspan><\u002Fdiv><div style=\"margin:10px;display:flex;align-items:center;gap:8px;background:#171b26;border:1px solid #262b3a;border-radius:9px;padding:8px 10px\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5c6478\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m16.5 16.5 4 4\"><\u002Fpath><\u002Fsvg><span style=\"flex:1;font-size:11.5px;color:#5c6478\">Пошук по запиту, текстах і викликах<\u002Fspan><\u002Fdiv><div style=\"padding:0 12px 12px;display:flex;flex-direction:column;gap:8px\"><div style=\"display:flex;flex-direction:column;gap:6px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:11px 12px\"><div style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:6px;height:6px;border-radius:50%;background:#8891a8\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#8891a8\">ВИ<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#4a5164\">14:09<\u002Fspan><\u002Fdiv><span style=\"font-size:12.5px;line-height:1.55;color:#dde1ee;text-wrap:pretty\">Перевір, чи не тримає кеш старі сесії<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:11px 12px\"><div style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:6px;height:6px;border-radius:50%;background:#4ade80\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#8891a8\">ТЕСТЕР<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#4a5164\">14:10<\u002Fspan><\u002Fdiv><span style=\"font-size:12.5px;line-height:1.55;color:#dde1ee;text-wrap:pretty\">Прогнав auth: два тести з дев'яти впали на простроченому кукі.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:5px;padding-top:2px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">РЯДОК ВКЛАДОК НЕ МАЄ ВІД ПОШУКУ НІЧОГО: «+ НОВИЙ ЧАТ» СТОЇТЬ ТАМ, ДЕ СТОЯВ (23c)<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">СМУГА БЕЗ ВЛАСНОЇ РИСКИ Й З ВІДСТУПОМ З УСІХ БОКІВ — НАД РОЗМОВОЮ, А НЕ ЩЕ ОДНА ЇЇ СМУГА<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">СКЛА НЕМА: ПОЛЕ І Є ВХІД. ⌘F ПРОСИТЬ КАРЕТКУ Й НЕ ЧІПАЄ ПОЛЯ ПИТАННЯ ВНИЗУ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ПОЛЕ ТЕ САМЕ, ЩО НАД ІСТОРІЄЮ (23t), ДО ПІКСЕЛЯ — ОДИН ПОШУК, СКАЗАНИЙ ДВІЧІ<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">ХОДА ПО ЗБІГАХ · «1» — НАЙСВІЖІШИЙ<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"width:560px;background:#0d0f16;border-radius:10px;overflow:hidden\"><div style=\"display:flex;align-items:center;gap:14px;background:#12151f;border-bottom:1px solid #1c202c;padding:0 14px;height:38px;box-sizing:border-box\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#dde1ee;border-bottom:1.5px solid #38a3ff;height:100%;display:flex;align-items:center\">ПОТІК<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#5c6478;border-bottom:1.5px solid transparent;height:100%;display:flex;align-items:center\">ІСТОРІЯ<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#38a3ff\">+ НОВИЙ ЧАТ<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:center;gap:8px;background:#12151f;border-bottom:1px solid #1c202c;padding:0 14px;height:30px;box-sizing:border-box\"><span style=\"width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade80\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#5c6478\">ІДЕ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#e8c46a\">TESTER<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#4a5164\">КРОК 3<\u002Fspan><\u002Fdiv><div style=\"margin:10px;display:flex;align-items:center;gap:8px;background:#171b26;border:1px solid #2c3550;border-radius:9px;padding:8px 10px;box-shadow:0 0 0 2px #38a3ff44\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5c6478\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m16.5 16.5 4 4\"><\u002Fpath><\u002Fsvg><span px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:11px 12px\"><div style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:6px;height:6px;border-radius:50%;background:#4ade80\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#8891a8\">ТЕСТЕР<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#4a5164\">14:10<\u002Fspan><\u002Fdiv><span style=\"font-size:12.5px;line-height:1.55;color:#dde1ee;text-wrap:pretty\">Далі дивлю, звідки він береться після виходу.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;background:#171b26;border:1px solid #2c3550;box-shadow:inset 2px 0 0 #38a3ff;border-radius:10px;padding:11px 12px\"><div style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:6px;height:6px;border-radius:50%;background:#4ade80\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#8891a8\">ТЕСТЕР<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#4a5164\">14:11<\u002Fspan><\u002Fdiv><span style=\"font-size:12.5px;line-height:1.55;color:#dde1ee;text-wrap:pretty\">Прогнав auth: два тести з дев'яти впали на простроченому <span style=\"background:#38a3ff22;border-radius:3px;padding:1px 0\">кукі<\u002Fspan>.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:5px;padding-top:2px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">«1» — ОСТАННЄ МІСЦЕ, ДЕ СЛОВО СКАЗАЛИ: НАБРАНА ЛІТЕРА ОДРАЗУ КИДАЄ ТУДИ, ХОДА ЙДЕ В МИНУЛЕ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">НАЙСВІЖІШЕ ВНИЗУ, ТОМУ НАСТУПНИЙ ЗБІГ ВИЩЕ: ▲ — НАСТУПНИЙ, ▼ — ПОПЕРЕДНІЙ. СТРІЛКА КАЖЕ, КУДИ ПОЇДЕ ПОТІК<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ТА САМА ХОДА В ENTER І ⇧ENTER; З ПЕРШОГО ▼ ПРИХОДИТЬ У СЬОМИЙ. НІЧОГО НЕ ЗНАЙШЛОСЬ — СТРІЛКИ НЕНАТИСКНІ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ХРЕСТИК ПРИБИРАЄ СЛОВО — ТУТ І В ІСТОРІЇ ОДНАКОВО; ESCAPE СПОРОЖНЯЄ ПОЛЕ, А НЕ ЗАБИРАЄ ЙОГО<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">СМУЖКА НА КАРТЦІ ЖИВЕ 2,4 С І ГАСНЕ — ЗАВЖДИ. ІНШІ ЗБІГИ ПІДСВІЧЕНІ ТЛОМ, СМУЖКУ МАЄ РІВНО ОДИН<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ШУКАЄТЬСЯ ЛИШЕ СКАЗАНЕ ЛЮДИНОЮ Й АГЕНТОМ. «ХІД НЕ ПОЧАВСЯ» (4e), СЛОВО ЗАСТОСУНКУ НА РИСЦІ (4g), ПЕРЕДАЧА Й КОПІЯ ЛІНІЄЮ — ПОЗА ПОШУКОМ<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div id=\"23v\" style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:baseline;gap:12px;max-width:1100px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:#38a3ff;background:#12151f;border:1px solid #262b3a;border-radius:6px;padding:3px 8px;flex-shrink:0\">23v<\u002Fspan><span style=\"font-size:15px;font-weight:600;flex-shrink:0\">Слово переходить з історії в потік<\u002Fspan><span style=\"font-size:13px;line-height:1.6;color:#838ba6;text-wrap:pretty\">Набране над історією не гине на переході: людина тисне рядок — <b style=\"color:#dde1ee;font-weight:600\">те саме слово вже стоїть у полі потоку, і потік уже стоїть на збігу<\u002Fb>, бо це той самий пошук, а не два. Переходить і назад, із потоку в історію, з того ж міркування. Відкритий <b style=\"color:#dde1ee;font-weight:600\">інший<\u002Fb> запуск слова не гасить: рука полює слово по записі, і гасити його на кожному рядку означало б набирати те саме сорок разів. Слово, перенесене в потік, стає на <b style=\"color:#dde1ee;font-weight:600\">найсвіжіший<\u002Fb> свій збіг у цьому запуску — те саме правило, що й у ході по стрілках (<a href=\"#23u\">23u<\u002Fa>), тож правило одне, а не два. Гасить слово одне — «+ НОВИЙ ЧАТ»: у новій розмові знаходити нема чого, і число стояло б нулем назавжди (<a href=\"#23c\">23c<\u002Fa>).<\u002Fspan><\u002Fdiv>\n<div style=\"width:1220px;flex-shrink:0;background:#262b3a;background-image:radial-gradient(circle, rgba(255,255,255,0.14) 1px, transparent 1px);background-size:8px 8px;background-position:3px 3px;padding:35px;display:flex;gap:28px;box-sizing:border-box;border-radius:4px\"><div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">ІСТОРІЯ · СЛОВО НАБРАНЕ, РЯДОК НАТИСНУТИЙ<\u002Fspan><div style=\"width:380px;background:#12151f;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-sizing:border-box\"><div style=\"display:flex;align-items:center;gap:8px;background:#171b26;border:1px solid #2c3550;border-radius:9px;padding:8px 10px;box-shadow:0 0 0 2px #38a3ff44\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5c6478\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m16.5 16.5 4 4\"><\u002Fpath><\u002Fsvg><span style=\"flex:1;font-size:12px;color:#dde1ee\">кукі<span style=\"display:inline-block;width:1px;height:12px;background:#38a3ff;margin-left:1px;vertical-align:-2px\"><\u002Fspan><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#6b7490;flex-shrink:0\">21 МІСЦЕ · 4 ЗАПУСКИ<\u002Fspan><span style=\"flex-shrink:0;display:flex\"><svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5c6478\" stroke-width=\"2.4\" stroke-linecap=\"round\"><pat d\" stroke-linejoin=\"round\"><path d=\"m6 14 6-6 6 6\"><\u002Fpath><\u002Fsvg><svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8891a8\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m6 10 6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"flex-shrink:0;display:flex\"><svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5c6478\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6 6 18\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fdiv><div style=\"padding:0 12px 12px;display:flex;flex-direction:column;gap:8px\"><div style=\"display:flex;flex-direction:column;gap:6px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:11px 12px\"><div style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:6px;height:6px;border-radius:50%;background:#8891a8\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#8891a8\">ВИ<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#4a5164\">14:09<\u002Fspan><\u002Fdiv><span style=\"font-size:12.5px;line-height:1.55;color:#dde1ee;text-wrap:pretty\">Прогони тести пакета auth і скажи, що впало<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;background:#171b26;border:1px solid #2c3550;box-shadow:inset 2px 0 0 #38a3ff;border-radius:10px;padding:11px 12px\"><div style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:6px;height:6px;border-radius:50%;background:#4ade80\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#8891a8\">ТЕСТЕР<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#4a5164\">14:10<\u002Fspan><\u002Fdiv><span style=\"font-size:12.5px;line-height:1.55;color:#dde1ee;text-wrap:pretty\">Прогнав auth: два тести з дев'яти впали на простроченому <span style=\"background:#38a3ff22;border-radius:3px;padding:1px 0\">кукі<\u002Fspan>.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:5px;padding-top:2px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ПОЛЕ ЗАПОВНЕНЕ, АЛЕ КАРЕТКИ В НЬОМУ НЕМА: РУКА ПРИЙШЛА ЧИТАТИ, А НЕ НАБИРАТИ — САМЕ ПОЛЕ СТОЇТЬ ЗАВЖДИ (23u)<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ЧИСЛО ТУТ СВОЄ — ЗБІГИ ЦЬОГО ПОТОКУ («1 З 3»), А НЕ 21 ЗНАЙДЕНЕ МІСЦЕ ВСЬОГО ЗАПИСУ (23t)<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">СМУЖКА НА ЗНАЙДЕНІЙ КАРТЦІ ЖИВЕ 2,4 С І ГАСНЕ — ЗАВЖДИ, ХОЧ БИ ЯК ТУДИ ДІЙШЛИ (23u): ПОЇЗДКА ВЖЕ СКАЗАЛА, ДЕ ВОНО<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ІНШИЙ ЗАПУСК — СЛОВО ЛИШАЄТЬСЯ Й ПОТІК ЗНОВУ СТАЄ НА ЙОГО НАЙСВІЖІШИЙ ЗБІГ («1»)<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">«+ НОВИЙ ЧАТ» — ЄДИНЕ, ЩО ГАСИТЬ СЛОВО: НОВІЙ РОЗМОВІ НЕМА ЩО ЗНАХОДИТИ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ЗБІГІВ У ЦЬОМУ ЗАПУСКУ НЕМА — ПОЛЕ ЗІ СЛОВОМ СТОЇТЬ, ЧИСЛО КАЖЕ «0 З 0», ПОТІК ВІД ПОЧАТКУ<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n  <div id=\"23w\" style=\"display:flex;flex-direction:column;gap:12px\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;max-width:1100px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:#38a3ff;background:#12151f;border:1px solid #262b3a;border-radius:6px;padding:3px 8px;flex-shrink:0\">23w<\u002Fspan>\n      <span style=\"font-size:15px;font-weight:600;flex-shrink:0\">Кнопка «вниз потоку»<\u002Fspan>\n      <span style=\"font-size:13px;line-height:1.6;color:#838ba6;text-wrap:pretty\">Кнопка одна, і вона про <b style=\"color:#dde1ee;font-weight:600\">місце<\u002Fb>: є рівно тоді, коли низ потоку не видно, і зникає, коли видно. Новина не заводить другої кнопки — вона підписує ту саму: поки людина читає вгорі, тиха стрілка стає пілюлею з числом («3 НОВІ»), бо повернутись униз і подивитись нове — один рух, а дві плаваючі речі в правому нижньому куті не вміщаються й змагаються за той самий клік. Стоїть усередині смуги потоку, притиснута до правого краю, 16 px над полем вводу: центр — це шлях ока по тексту, і кнопка перекривала б останню репліку. Вигляд тихий, як решта наведень (<a href=\"#42a\">42a<\u002Fa>): коло 32 px, фон картки, рамка спокою <code style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#aab3cc\">#262b3a<\u002Fcode> (під мишею — <code style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#aab3cc\">#2c3550<\u002Fcode>, як усюди), стрілка кольору другого рівня; з числом рамка й стрілка беруть зелене «іде», бо число говорить про живе. Зникає тим самим переходом, що все інше (<code style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#aab3cc\">INTERACTION_TRANSITION<\u002Fcode>) — окремої швидкості для неї не заводимо. У запуску, відкритому з історії, кнопка є, але тільки тиха: потік там мертвий, новин не буде, і числа не буває — доки в нього не дописали (<a href=\"#23j\">23j<\u002Fa>), бо дописаний потік знову живий.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"width:1674px;flex-shrink:0;background:#262b3a;background-image:radial-gradient(circle, rgba(255,255,255,0.14) 1px, transparent 1px);background-size:8px 8px;background-position:3px 3px;padding:35px;display:flex;gap:28px;box-sizing:border-box;border-radius:4px\">\n      <div style=\"width:380px;flex-shrink:0;display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">НИЗ ВИДНО · КНОПКИ НЕМА<\u002Fspan>\n        <div style=\"position:relative;width:380px;background:#12151f;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:9px;box-sizing:border-box\">\n            <div style=\"display:flex;flex-direction:column;gap:6px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:10px 11px\">\n              <div style=\"display:flex;align-items:center;gap:7px\">\n                <span style=\"width:6px;height:6px;border-radius:50%;background:#838ba6\"><\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#838ba6\">ВИ<\u002Fspan>\n                <span style=\"flex:1\"><\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#4a5164\">10:19<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"font-size:12.5px;line-height:1.55;color:#dde1ee;text-wrap:pretty\">Додай опис і постав рев’ювера<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:10px 11px\">\n              <div style=\"display:flex;align-items:center;gap:7px\">\n                <span style=\"width:6px;height:6px;border-radius:50%;background:#e8c46a\"><\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#e8c46a\">TESTER<\u002Fspan>\n                <span style=\"flex:1\"><\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#4a5164\">10:21<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"font-size:12.5px;line-height:1.55;color:#aab3cc;text-wrap:pretty\">Опис додано, рев’юера поставив — чекаю на відповідь.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height:26px;flex-shrink:0\"><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:9px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:10px 11px\">\n              <span style=\"flex:1;font-size:12.5px;color:#4a5164\">Напишіть агентові…<\u002Fspan>\n              <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#4a5164\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 19V5M5 12l7-7 7 7\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">КНОПКА Є РІВНО ТОДІ, КОЛИ НИЗ НЕ ВИДНО: ЦЕ КНОПКА ПРО МІСЦЕ, А НЕ ПРО НОВИНУ<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ЗНИКАЄ ТИМ САМИМ ПЕРЕХОДОМ, ЩО ВСЕ ІНШЕ (INTERACTION_TRANSITION) — ОКРЕМОЇ ШВИДКОСТІ НЕ ЗАВОДИМО<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"width:380px;flex-shrink:0;display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">ГОРТАЮТЬ УГОРІ · ТИХА СТРІЛКА<\u002Fspan>\n        <div style=\"position:relative;width:380px;background:#12151f;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:9px;box-sizing:border-box\">\n            <div style=\"display:flex;flex-direction:column;gap:6px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:10px 11px\">\n              <div style=\"display:flex;align-items:center;gap:7px\">\n                <span style=\"width:6px;height:6px;border-radius:50%;background:#b18aff\"><\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#b18aff\">EDITOR<\u002Fspan>\n                <span style=\  ВІДПОВІДІ<\u002Fspan><\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">СУМА ЖИВЕ В ОДНОМУ МІСЦІ · ПРОЄКЦІЯ ЇЇ НЕ ПОВТОРЮЄ<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"height:1px;background:#1c202c\"><\u002Fdiv>\n\n      <div style=\"display:flex;gap:20px;align-items:flex-start\">\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">ШЛЯХ УСЕРЕДИНУ · НА КАРТЦІ ПИТАННЯ<\u002Fspan>\n          <div style=\"width:520px;background:#12151f;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:9px;box-sizing:border-box\">\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <span style=\"width:6px;height:6px;border-radius:50%;background:#5c6478\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">ВИ<\u002Fspan>\n              <span style=\"flex:1\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#5c6478\">15:47<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size:12.5px;line-height:1.65;color:#dde1ee;text-wrap:pretty\">Зроби те саме для fetchOrder<\u002Fspan>\n            <div style=\"display:flex;align-items:center;gap:6px;padding-top:2px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#38a3ff\">\n              ДЕБАҐ ЗАПУСКУ\n              <svg width=\"9\" height=\"9\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#38a3ff\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 17 17 7M9 7h8v8\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7;width:520px\">СМУГА СТОЇТЬ ПІД ТЕКСТОМ ПИТАННЯ, У СИНЬОМУ КОЛЬОРІ ДІЇ, МОНО 9px — ТЕ САМЕ, ЩО СТОЯЛО В ГОЛОВІ ЧАТУ<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">ПИТАННЯ, ЯКЕ НЕ ПІШЛО · 23n — ШЛЯХУ НЕМА<\u002Fspan>\n          <div style=\"width:520px;background:#12151f;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:9px;box-sizing:border-box;opacity:0.62\">\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <span style=\"width:6px;height:6px;border-radius:50%;background:#5c6478\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">ВИ<\u002Fspan>\n              <span style=\"flex:1\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#5c6478\">15:49<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size:12.5px;line-height:1.65;color:#dde1ee;text-wrap:pretty\">І для fetchInvoice теж<\u002Fspan>\n            <div style=\"display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px dashed #3a2a30\">\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#a9808a\">ПИТАННЯ НЕ ПІШЛО · EDITOR ВИМКНЕНИЙ<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:5px;width:520px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ХОДІВ НЕМА, КРОКІВ НЕМА, РИСКИ ЧАСУ НЕМА — ПОРОЖНЯ ПРОЄКЦІЯ Б БРЕХАЛА, ЩО ПРОГІН БУВ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">СМУГА ЗʼЯВЛЯЄТЬСЯ, ЩОЙНО ВІДПОВІВ ПЕРШИЙ ХІД: ДО НЬОГО МАЛЮВАТИ НЕМА ЧОГО<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">У ЗАПИСІ 23n РЯДКА НЕМА, ТОМУ З ІСТОРІЇ ТАКЕ ПИТАННЯ ПРИЙДЕ БЕЗ РИСКИ — І БЕЗ СМУГИ ТЕЖ<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"24h\" style=\"display:flex;flex-direction:column;gap:12px\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;max-width:1100px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:#38a3ff;background:#12151f;border:1px solid #262b3a;border-radius:6px;padding:3px 8px;flex-shrink:0\">24h<\u002Fspan>\n      <span style=\"font-size:15px;font-weight:600;flex-shrink:0\">Стрілки: сірі при спокої, кольорові тільки під поглядом<\u002Fspan>\n      <span style=\"font-size:13px;line-height:1.6;color:#838ba6;text-wrap:pretty\">Запис спершу дивляться цілим, а колір на кожній лінії одразу робить із графа вітраж, у якому не видно ходу. Тому <b style=\"color:#dde1ee;font-weight:600\">у лінії два стани: при спокої — тиха, цільна, 1.4 px у #2b3145, та сама вага для всіх; активна — кольором відправника зі слідом, і засвічується тоді, коли дивляться саме цей крок<\u002Fb>: відкритий крок запалює свої власні лінії, вхідні й вихідні, решта лишається сірою. Наконечник цілить в обід, але не торкається його: повітря береться в частках радіуса, як на полотні, а жолоб рахується з наконечника й кута, тому кут не зрізається — числа всіх чотирьох випадків нижче. Дрейф лишається полотну: там він каже «зараз біжить», а в записі не біжить нічого. Пунктир лишається відсутністю: «не дійшло» (<a href=\"#24d\">24d<\u002Fa>) і зв'язок того самого агента внизу (<a href=\"#24a\">24a<\u002Fa>).<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"width:540px;flex-shrink:0;background:#262b3a;background-image:radial-gradient(circle, rgba(255,255,255,0.14) 1px, transparent 1px);background-size:8px 8px;background-position:3px 3px;padding:35px;display:flex;gap:26px;box-sizing:border-box;border-radius:4px\">\n\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">ДВА СТАНИ ЛІНІЇ<\u002Fspan>\n        <div style=\"width:470px;background:#0d0f16;border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#dde1ee\">ПРИ СПОКОЇ · ТИХА, ЦІЛЬНА, НАКОНЕЧНИК ДО ОБОДА<\u002Fspan>\n            <svg width=\"430\" height=\"96\" sc-camel-view-box=\"0 0 430 96\" style=\"overflow:visible\">\n              <line x1=\"102.4\" y1=\"48\" x2=\"315.6\" y2=\"48\" stroke=\"#2b3145\" stroke-width=\"1.4\" stroke-linecap=\"round\"><\u002Fline>\n              <polygon points=\"324.6,48 315.6,43.5 315.6,52.5\" fill=\"#2b3145\"><\u002Fpolygon>\n              <circle cx=\"64\" cy=\"48\" r=\"30\" fill=\"#171b26\" stroke=\"#2c3550\" stroke-width=\"1.2\"><\u002Fcircle>\n              <circle cx=\"366\" cy=\"48\" r=\"30\" fill=\"#171b26\" stroke=\"#2c3550\" stroke-width=\"1.2\"><\u002Fcircle>\n              <text x=\"64\" y=\"51\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"9\" letter-spacing=\"1\" fill=\"#b18aff\">EDITOR<\u002Ftext>\n              <text x=\"366\" y=\"51\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"9\" letter-spacing=\"1\" fill=\"#e8c46a\">TESTER<\u002Ftext>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"height:1px;background:#1c202c\"><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#dde1ee\">АКТИВНА · КОЛІР ВІДПРАВНИКА, ЗІ СЛІДОМ<\u002Fspan>\n            <svg width=\"430\" height=\"96\" sc-camel-view-box=\"0 0 430 96\" style=\"overflow:visible\">\n              <line x1=\"102.4\" y1=\"48\" x2=\"315.6\" y2=\"48\" stroke=\"color-mix(in srgb, #b18aff 18%, transparent)\" stroke-width=\"9\" stroke-linecap=\"round\"><\u002Fline>\n              <line x1=\"102.4\" y1=\"48\" x2=\"315.6\" y2=\"48\" stroke=\"#b18aff\" stroke-width=\"1.4\" stroke-linecap=\"round\"><\u002Fline>\n              <polygon points=\"324.6,48 315.6,43.5 315.6,52.5\" fill=\"#b18aff\"><\u002Fpolygon>\n              <circle cx=\"64\" cy=\"48\" r=\"30\" fill=\"#171b26\" stroke=\"#3a3050\" stroke-width=\"1.6\"><\u002Fcircle>\n              <circle cx=\"366\" cy=\"48\" r=\"30\" fill=\"#171b26\" stroke=\"#4a4028\" stroke-width=\"1.6\"><\u002Fcircle>\n              <text x=\"64\" y=\"51\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"9\" letter-spacing=\"1\" fill=\"#b18aff\">EDITOR<\u002Ftext>\n              <text x=\"366\" y=\"51\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"9\" letter-spacing=\"1\" fill=\"#e8c46a\">TESTER<\u002Ftext>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:5px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ВАГА ОДНА НА ОБИДВА СТАНИ — 1.4 px: МІНЯЄТЬСЯ КОЛІР, А НЕ ТОВЩИНА. АКТИВНІЙ РОСТИ НІКУДИ Й НЕ ТРЕБА — ЇЙ ДОДАЄТЬСЯ СЛІД 9 px, 18 %<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ПРИ СПОКОЇ ЛІНІЯ БЕРЕ ТОЙ САМИЙ #2b3145, ЩО Й НА ПОЛОТНІ: НАЙСПОКІЙНІШИЙ ЕКРАН НЕ МОЖЕ БУТИ НАЙГУЧНІШИМ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ЗАПАЛЮЄ ЛІНІЮ ВІДКРИТИЙ КРОК — СВОЇ ВХІДНІ Й ВИХІДНІ; КОЛІР БЕРЕТЬСЯ ВІД ВІДПРАВНИКА, ЯК У РИСЦІ «EDITOR ПЕРЕДАЄ → TESTER»<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">НАКОНЕЧНИК ЦІЛИТЬ В ОБІД, А НЕ В ЦЕНТР — І НЕ ТОРКАЄТЬСЯ ЙОГО: МІЖ ВІСТРЯМ І ОБОДОМ 0.38 РАДІУСА ПОВІТРЯ, З ХВОСТА 0.28<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ДРЕЙФ КОРОТКИМИ РИСКАМИ — ТІЛЬКИ НА ПОЛОТНІ, ДЕ ПОТІК ІДЕ ЗАРАЗ<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc;padding-top:6px\">ЧОТИРИ ВИПАДКИ · ЧИСЛА<\u002Fspan>\n        <div style=\"width:470px;background:#0d0f16;border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;color:#dde1ee\">СПОКІЙ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#838ba6\">1.4 px · #2b3145 · без сліду<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:1px;background:#1c202c\"><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;color:#dde1ee\">АКТИВНА<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#838ba6\">1.4 px · колір відправника · слід 9 px, 18 %<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ВАГА ТА САМА, ЩО В СПОКОЇ: РОСТЕ НЕ ЛІНІЯ, А СЛІД ПІД НЕЮ<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:1px;background:#1c202c\"><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;color:#dde1ee\">ВХІД У СФЕРУ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#838ba6\">повітря 12.8 px = 0.38 обода · наконечник 9 × 9 px · жолоб приймача 39.8 px<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:1px;background:#1c202c\"><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;color:#dde1ee\">ВИХІД ЗІ СФЕРИ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#838ba6\">повітря 9.4 px = 0.28 обода · жолоб відправника 27.4 px · кут 9 px<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:1px;background:#1c202c\"><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:5px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ОБІД ПРОЄКЦІЇ 33.6 px (СФЕРА 160 × 0.42); ЧАСТКИ ВЗЯТІ З ПОЛОТНА, ДЕ ПРИ ОБОДІ 80 px ХВІСТ 22 І ГОЛОВА 30<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ЖОЛОБ НЕ ЗАДАЄТЬСЯ, А РАХУЄТЬСЯ: ПОВІТРЯ + НАКОНЕЧНИК + ДВА КУТИ — ТОМУ ЗРІЗАТИ КУТ НЕМА ЧОГО НІ ПРИ ЯКОМУ МАСШТАБІ<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc;padding-top:6px\">ДВІ ВХІДНІ · ОДИН НАКОНЕЧНИК<\u002Fspan>\n        <div style=\"width:470px;background:#0d0f16;border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:5px;box-sizing:border-box\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ДВІ ВХІДНІ В REVIEWER ПІДІЙМАЮТЬСЯ ОДНІЄЮ ВЕРТИКАЛЛЮ ЖОЛОБА Й ЛЯГАЮТЬ ОДНА НА ОДНУ — ЯК ЗЛИТТЯ В ГРАФІ КОМІТІВ<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">НАКОНЕЧНИК ЗВІДТИ ОДИН, І МАЛЮЄ ЙОГО ПРИЙМАЧ — САМЕ ВІСТРЯ, БЕЗ ВЛАСНОГО ШМАТКА ЛІНІЇ: КОЖНА ВХІДНА САМА ПОВЕРТАЄ В РЯД СВОЇМ КУТОМ І ЙДЕ ДО ОСНОВИ ВІСТРЯ<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ВІД ВЕРТИКАЛІ ЖОЛОБА ДО ОСНОВИ НАКОНЕЧНИКА РІВНО ДВА КУТИ, ТОМУ ЗАКРУГЛЕННЯ ВИХОДИТЬ ПОВНЕ Й ПРЯМИХ СТИКІВ У КРЕСЛЕННІ НЕМА ЗОВСІМ<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ДІАГОНАЛЕЙ І ДУГ НЕМА НІДЕ: ТІЛЬКИ ГОРИЗОНТАЛІ, ВЕРТИКАЛІ Й ЗАКРУГЛЕНИЙ КУТ 9 px<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"24i\" style=\"display:flex;flex-direction:column;gap:12px\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;max-width:1100px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:#38a3ff;background:#12151f;border:1px solid #262b3a;border-radius:6px;padding:3px 8px;flex-shrink:0\">24i<\u002Fspan>\n      <span style=\"font-size:15px;font-weight:600;flex-shrink:0\">Перехід між прогонами — зсередини<\u002Fspan>\n      <span style=\"font-size:13px;line-height:1.6;color:#838ba6;text-wrap:pretty\">Проєкцію відкривають, щоб зрозуміти, чому другий раз пішло інакше, ніж перший — а це порівняння двох прогонів одного потоку. Без перемикача воно коштує вихід у потік і пошук іншої картки, і в голові треба тримати перший граф. <b style=\"color:#dde1ee;font-weight:600\">Тому в шапці стоїть тихий перемикач «‹ ПИТАННЯ 2 З 2 ›» — того самого тону, що й решта шапки, не дія.<\u002Fb> Ходить він тільки по прогонах цього потоку, у порядку, в якому питали; питання, яке не пішло (<a href=\"#23n\">23n<\u002Fa>), не має прогону — його не лічать і в нього не переходять. Стрілка назад лишається одна й веде в потік, до картки цього питання (<a href=\"#24g\">24g<\u002Fa>).<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"width:1690px;flex-shrink:0;background:#262b3a;background-image:radial-gradient(circle, rgba(255,255,255,0.14) 1px, transparent 1px);background-size:8px 8px;background-position:3px 3px;padding:35px;display:flex;flex-direction:column;gap:22px;box-sizing:border-box;border-radius:4px\">\n      <div style=\"background:#0d0f16;border-radius:10px;overflow:hidden\">\n        <div style=\"display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid #1c202c\">\n          <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#838ba6\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m14 6-6 6 6 6\"><\u002Fpath><\u002Fsvg>\n          <span style=\"display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#838ba6\">\n            <svg width=\"9\" height=\"9\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#838ba6\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m14 6-6 6 6 6\"><\u002Fpath><\u002Fsvg>\n            ПИТАННЯ 2 З 2\n            <svg width=\"9\" height=\"9\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3a4154\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m10 6 6 6-6 6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n          <span style=\"width:1px;height:14px;background:#262b3a\"><\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#838ba6\">Прогін · 15:47<\u002Fspan>\n          <span style=\"font-size:12.5px;color:#dde1ee\">Зроби те саме для fetchOrder<\u002Fspan>\n          <span style=\"flex:1\"><\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:7px;background:#12151f;border:1px solid #2c4a3a;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4ade80\">ЗАВЕРШЕНО<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#5c6478\">1 хв 52 · 4 КРОКИ · 8 120 ТКН · $0.09<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:14px 18px;display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">СТРІЛКА В КІНЦІ СПИСКУ ГАСНЕ Й НЕ КРУТИТЬ ПО КОЛУ — КРАЙ ПОТОКУ ВИДНО НА ОКО<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">З КЛАВІАТУРИ — ⌥← / ⌥→; ⎋ ВИХОДИТЬ У ПОТІК, ЯК І СТРІЛКА НАЗАД<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ПЕРЕХІД ПЕРЕМАЛЬОВУЄ ГРАФ І ПІДСУМКИ, АЛЕ НЕ ЗАКРИВАЄ ПРОЄКЦІЮ Й НЕ ЧІПАЄ ПОЛОТНА ПОЗАДУ<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:20px\">\n        <div style=\"flex:1;background:#12151f;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:9px\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">ЩО ЛІЧИТЬ «З 2»<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:7px\">\n            <div style=\"display:flex;align-items:center;gap:9px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;color:#838ba6\"><span style=\"color:#4a5164;width:14px\">1<\u002Fspan>КЕШУВАННЯ У FETCHUSER · 6 КРОКІВ<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:9px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;color:#dde1ee\"><span style=\"color:#38a3ff;width:14px\">2<\u002Fspan>ТЕ САМЕ ДЛЯ FETCHORDER · 4 КРОКИ<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:9px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;color:#4a5164;text-decoration:line-through;text-decoration-color:#3a2a30\"><span style=\"width:14px\">—<\u002Fspan>І ДЛЯ FETCHINVOICE ТЕЖ · НЕ ПІШЛО (23n)<\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ТРИ ПИТАННЯ В ПОТОЦІ, ДВА ПРОГОНИ — «2 З 2», НЕ «2 З 3»<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:1;background:#12151f;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:9px\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">ЧОГО ПЕРЕМИКАЧ НЕ РОБИТЬ<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">НЕ ХОДИТЬ МІЖ ПОТОКАМИ: ІНШИЙ ПОТІК — ІНШИЙ РЯДОК ІСТОРІЇ (23a)<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">НЕ КЛАДЕ ДВА ГРАФИ ПОРЯД: ПОРІВНЮЮТЬ ПЕРЕХОДОМ, А НЕ ПОДІЛОМ ЕКРАНА<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">НЕ ПАМʼЯТАЄ ПАНОРАМУ: НОВИЙ ПРОГІН ПРИХОДИТЬ ВПИСАНИМ, ЯК ПРИ ВІДКРИТТІ<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ПРОГІН, ЩО ТРИВАЄ, ПЕРЕМИКАЧ НЕ ХОВАЄ — ПІЛЮЛЯ СКАЖЕ «ТРИВАЄ»<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"24k\" style=\"display:flex;flex-direction:column;gap:12px\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;max-width:1100px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:#38a3ff;background:#12151f;border:1px solid #262b3a;border-radius:6px;padding:3px 8px;flex-shrink:0\">24k<\u002Fspan>\n      <span style=\"font-size:15px;font-weight:600;flex-shrink:0\">Довгий прогін не влазить — рух той самий, що на полотні<\u002Fspan>\n      <span style=\"font-size:13px;line-height:1.6;color:#838ba6;text-wrap:pretty\">Людина приходить у проєкцію з полотна й повертається на полотно, тому <b style=\"color:#dde1ee;font-weight:600\">другої мови рухів тут немає: поле тягнеться лівою кнопкою по порожньому місцю, подвійний клік вписує прогін цілком, колесо масштабує до курсора<\u002Fb> — ті самі жести, що в <a href=\"#12a\">12a<\u002Fa>, і пробіл тут ні до чого, бо на полотні його теж немає. Своє тут одне: колонки рівні й риска часу прив'язана до них, тому поле ходить вільно по обох осях, а риска часу лишається вгорі приклеєною — інакше, з'їхавши, вона починає казати мить не тієї колонки, під якою стоїть. Панель зуму стоїть у тому ж лівому нижньому кутку, що на полотні (<a href=\"#13a\">13a<\u002Fa>): без числа граф у проєкції на око не відрізнити — малий він чи далекий. <b style=\"color:#dde1ee;font-weight:600\">А межі не ті самі й не можуть бути<\u002Fb>: сфера тут намальована в 0.42 своєї величини, тому шкала проєкції — 50 % … 150 % кроком 10 проти 30 % … 100 % на полотні. При відкритті прогін уже вписаний, але не ближче за 120 %; зум тримається лише поки проєкція відкрита — перехід між прогонами (<a href=\"#24i\">24i<\u002Fa>) приносить новий уже вписаним. Колонка чисел нижче — щоб різниця стояла в кадрі, а не в голові.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"width:1690px;flex-shrink:0;background:#262b3a;background-image:radial-gradient(circle, rgba(255,255,255,0.14) 1px, transparent 1px);background-size:8px 8px;background-position:3px 3px;padding:35px;display:flex;gap:26px;box-sizing:border-box;border-radius:4px\">\n\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">ПОЛЕ ЗСУНУТЕ ЛІВОЮ КНОПКОЮ · РИСКА ЧАСУ ПРИКЛЕЄНА ВГОРІ<\u002Fspan>\n        <div style=\"width:1000px;background:#0d0f16;border-radius:10px;overflow:hidden;box-sizing:border-box\">\n          <div style=\"display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid #1c202c\">\n            <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#838ba6\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m14 6-6 6 6 6\"><\u002Fpath><\u002Fsvg>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#838ba6\">Прогін · 16:03<\u002Fspan>\n            <span style=\"font-size:12.5px;color:#dde1ee\">Перебери всі виклики fetch і закрий їх кешем<\u002Fspan>\n            <span style=\"flex:1\"><\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#5c6478\">9 хв 41 · 14 КРОКІВ · 61 300 ТКН · $0.74<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"position:relative;height:300px;overflow:hidden\">\n            <div style=\"position:absolute;left:0;right:0;top:0;height:26px;background:#0d0f16;border-bottom:1px solid #14171f;display:flex;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;z-index:2\">\n              <span style=\"width:96px\"><\u002Fspan>\n              <span style=\"width:200px\">2:14<\u002Fspan>\n              <span style=\"width:200px\">3:02<\u002Fspan>\n              <span style=\"wid
