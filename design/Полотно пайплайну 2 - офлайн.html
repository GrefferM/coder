font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">\n            <span style=\"color:#6b7490\">КОЛОНКИ 1–5 ПІШЛИ ВЛІВО ЗА КРАЙ · ЛІНІЯ ОБРІЗАЄТЬСЯ КРАЄМ, НЕ ГАСНЕ<\u002Fspan>\n            <span>РИСКА ЧАСУ ЙДЕ ЗА ПОЛЕМ ГОРИЗОНТАЛЬНО, АЛЕ ВЕРХУ НЕ ПОКИДАЄ<\u002Fspan>\n            <span>ПАНЕЛЬ ЗУМУ — ТА САМА, ЩО НА ПОЛОТНІ (13a), І В ТОМУ Ж КУТКУ: 120 % — ЛЮДИНА НАБЛИЗИЛАСЬ ВІД ВПИСАНОГО<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">ЖЕСТИ · ТІ САМІ, ЩО НА ПОЛОТНІ<\u002Fspan>\n        <div style=\"width:560px;background:#12151f;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"display:flex;align-items:baseline;gap:10px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;color:#dde1ee;width:186px;flex-shrink:0\">ЛІВА КНОПКА ПО ПОРОЖНЬОМУ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490;line-height:1.7\">ТЯГНЕ ПОЛЕ ПО ОБОХ ОСЯХ · КУРСОР-РУКА, ЯК НА ПОЛОТНІ (12a)<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;gap:10px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;color:#dde1ee;width:186px;flex-shrink:0\">ПОДВІЙНИЙ КЛІК ПО ПОРОЖНЬОМУ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490;line-height:1.7\">ВПИСУЄ ПРОГІН ЦІЛКОМ — НЕ БЛИЖЧЕ ЗА 120 % І НЕ ДРІБНІШЕ ЗА 50 %<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;gap:10px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;color:#dde1ee;width:186px;flex-shrink:0\">КОЛЕСО<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490;line-height:1.7\">ЗУМ ДО КУРСОРА В МЕЖАХ 50 % … 150 %, КРОК 10 % — ЯК КНОПКИ ПАНЕЛІ<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;gap:10px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;color:#dde1ee;width:186px;flex-shrink:0\">ПРОБІЛ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490;line-height:1.7\">НІЧОГО: НА ПОЛОТНІ ЙОГО ТЕЖ НЕМА, А ЗАВОДИТИ ЖЕСТ ЗАРАДИ ОДНАКОВОСТІ НЕМА З ЧИМ<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;gap:10px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;color:#dde1ee;width:186px;flex-shrink:0\">ТЯГНУТИ ПО СФЕРІ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490;line-height:1.7\">ТЕ САМЕ, ЩО ПО ПОРОЖНЬОМУ — ТЯГНЕТЬСЯ ПОЛЕ: ЗАПИС НЕ РЕДАГУЮТЬ, І ВИБІРКИ РАМКОЮ ТУТ НЕМА<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height:1px;background:#1c202c\"><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:5px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ПРИ ВІДКРИТТІ ПРОГІН УЖЕ ВПИСАНИЙ — ПАНОРАМА ПОТРІБНА ТІЛЬКИ ТОМУ, ХТО НАБЛИЗИВ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ЗУМ І ЗСУВ НЕ ЗБЕРІГАЮТЬСЯ: ЗАКРИЛИ ПРОЄКЦІЮ — НАСТУПНОГО РАЗУ ВПИСАНО (24i)<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ПАНЕЛЬ ЗУМУ ТА САМА, ЩО НА ПОЛОТНІ (13a): БЕЗ ЧИСЛА ГРАФ НЕ ВІДРІЗНИТИ — МАЛИЙ ВІН ЧИ ДАЛЕКИЙ, І НЕ ЗНАТИ, ЧИ Є КУДИ НАБЛИЖАТИ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ПОЛОТНО ПОЗАДУ НЕ РУХАЄТЬСЯ Й НЕ ЗУМИТЬСЯ: ПРОЄКЦІЯ НАКРИВАЄ ЙОГО ЦІЛИМ<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc;padding-top:6px\">ЧИСЛА · ПОЛОТНО ПРОТИ ПРОЄКЦІЇ<\u002Fspan>\n        <div style=\"width:560px;background:#0d0f16;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box\">\n          <div style=\"display:flex;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490\">\n            <span style=\"width:132px;flex-shrink:0\"><\u002Fspan>\n            <span style=\"flex:1\">ПОЛОТНО<\u002Fspan>\n            <span style=\"flex:1;color:#aab3cc\">ПРОЄКЦІЯ<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:1px;background:#1c202c\"><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\">\n            <span style=\"width:132px;flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490;line-height:1.7\">ЖЕСТ ТЯГАННЯ<\u002Fspan>\n            <span style=\"flex:1;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#838ba6;line-height:1.6\">Ліва кнопка по порожньому<\u002Fspan>\n            <span style=\"flex:1;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#dde1ee;line-height:1.6\">Те саме · пробілу немає<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:1px;background:#1c202c\"><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\">\n            <span style=\"width:132px;flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490;line-height:1.7\">МЕЖІ<\u002Fspan>\n            <span style=\"flex:1;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#838ba6;line-height:1.6\">30 % … 100 %<\u002Fspan>\n            <span style=\"flex:1;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#dde1ee;line-height:1.6\">50 % … 150 %<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:1px;background:#1c202c\"><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\">\n            <span style=\"width:132px;flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490;line-height:1.7\">КРОК<\u002Fspan>\n            <span style=\"flex:1;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#838ba6;line-height:1.6\">10 %<\u002Fspan>\n            <span style=\"flex:1;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#dde1ee;line-height:1.6\">10 % · той самий<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:1px;background:#1c202c\"><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\">\n            <span style=\"width:132px;flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490;line-height:1.7\">МАСШТАБ ПРИ ВІДКРИТТІ<\u002Fspan>\n            <span style=\"flex:1;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#838ba6;line-height:1.6\">Той, на якому лишили · без запису — 100 %<\u002Fspan>\n            <span style=\"flex:1;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#dde1ee;line-height:1.6\">Вписано, але не ближче за 120 % і не дрібніше за 50 %<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:1px;background:#1c202c\"><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\">\n            <span style=\"width:132px;flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490;line-height:1.7\">СФЕРА НА 100 %<\u002Fspan>\n            <span style=\"flex:1;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#838ba6;line-height:1.6\">160 px · обід 80 px<\u002Fspan>\n            <span style=\"flex:1;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#dde1ee;line-height:1.6\">67 px · обід 33.6 px = 0.42<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:1px;background:#1c202c\"><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:5px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ЧОМУ МЕЖІ НЕ ТІ САМІ: ПРОЄКЦІЯ НА 100 % ДРІБНІША ЗА ПОЛОТНО НА 100 % У 2.4 РАЗА, ТОМУ СТЕЛЯ ПОЛОТНА ВПИРАЄТЬСЯ ТАМ, ДЕ ПРОЄКЦІЇ ЩЕ ТІСНО<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">НАВІТЬ НА СВОЇЙ СТЕЛІ 150 % СФЕРА ПРОЄКЦІЇ — 100 px: ДРІБНІША ЗА СФЕРУ ПОЛОТНА НА ЗВИЧНИХ 70 % (112 px)<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ОКРЕМОГО ПРАВИЛА ДЛЯ МЕЖІ НЕМА НІ ТУТ, НІ НА ПОЛОТНІ (11): ОБИДВА КІНЦІ ОБОХ ШКАЛ СТОЯТЬ НА КРОЦІ — 30 → 40 … 100 І 50 → 60 … 150<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
