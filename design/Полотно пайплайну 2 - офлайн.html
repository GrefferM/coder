"width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade80\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#5c6478\">ГОТОВО<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#6b7490\">LINTER<\u002Fspan>\n              <span style=\"flex:1\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#5c6478\">21 СЕР 16:20 · 40 с<\u002Fspan>\n              <span style=\"width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center\"><svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#4a5164\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6 6 18\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size:12.5px;line-height:1.5;color:#dde1ee;text-wrap:pretty\">Перевір лінтером усі зміни за тиждень<\u002Fspan>\n            <div style=\"display:flex;align-items:center;gap:6px\">\n              <span style=\"width:5px;height:5px;border-radius:50%;background:#5c6478\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#5c6478;padding-left:3px\">2 КРОКИ · $0.01<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ПРАВИЛО 24e ТЕ САМЕ: ЖИВЕ ІМ'Я ЩОРАЗУ БЕРЕТЬСЯ СВІЖЕ, А З ЗАПИСУ — ЛИШЕ ДЛЯ ВІДСУТНЬОГО; ТАКЕ ІМ'Я КОЛЬОРУ НЕ МАЄ Й СТОЇТЬ ТЬМЯНИМ — ВІДСУТНІСТЬ КОЛЬОРУ ТУТ І Є ЗНАК, ЩО АГЕНТА НЕМА; КРАПКА УЧАСТІ ПІД НИМ СІРА, ЯК У 44c<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:5px;padding-top:4px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ПИТАННЯ В РЯДКУ ЗМІНИЛОСЬ НА ОСТАННЄ: РЯДОК КАЖЕ, НА ЧОМУ РОЗМОВА СТОЇТЬ ЗАРАЗ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">УСІ ЧОТИРИ ЧИСЛА — ПРО ЗАПИС, І НИТКА АГЕНТА ЇХ НЕ ТОРКАЄТЬСЯ ТЕЖ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ПОЧАТКОВЕ ПИТАННЯ НЕ ГУБИТЬСЯ: ВОНО ПЕРШИМ У ВІДКРИТОМУ ПОТОЦІ, ДЕ Й ЧИТАЄТЬСЯ В ПОРЯДКУ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">СТАН ПЕРЕРАХОВУЄТЬСЯ САМ: «УПАВ» СТАЄ «ІДЕ» — ЗБЕРІГАТИ НІЧОГО НЕ ТРЕБА<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">НА «ІДЕ» ХРЕСТИКА НЕМА: ЗАПИС ЩЕ ПИШЕТЬСЯ, А ПІВ ЗАПИСУ — НІЧИЙ; У ЧИСЛІ ВКЛАДКИ (23h) ЦЕЙ РЯДОК ТЕЖ НЕ РАХУЄТЬСЯ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">КРОКИ Й ВАРТІСТЬ — ЗА ВЕСЬ ПОТІК, І ДРУГИЙ АГЕНТ ДОДАВ СВОЮ КРАПКУ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">КРАПКИ УЧАСТІ ЛИШАЮТЬСЯ Й ПРИ КОЛЬОРОВОМУ ІМЕНІ: ГОЛОВА НАЗИВАЄ ОДНОГО (ПИТАНОГО), КРАПКИ КАЖУТЬ, СКІЛЬКИ ЇХ БУЛО — ТУТ ЖОВТА ГОЛОВА Й ФІОЛЕТОВА КРАПКА КАЖУТЬ РІЗНЕ, І ЦЕ НЕ ЗБІГ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">«ПОЧАТО 23 СЕР» СТОЇТЬ ЛИШЕ ТОДІ, КОЛИ ПОТІК СТАРШИЙ ЗА СВОЮ ГРУПУ — ІНАКШЕ ЦЕ ПОВТОР ГОДИННИКА<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">ТРИДЦЯТЬ ДНІВ 26a · ВІД ОСТАННЬОЇ РЕПЛІКИ<\u002Fspan>\n        <div style=\"width:380px;background:#12151f;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;background:#171b26;border:1px solid #2c3550;border-radius:10px;padding:11px\">\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <span style=\"width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade80\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#5c6478\">ГОТОВО<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#6fd3d8\">REVIEWER<\u002Fspan>\n              <span style=\"flex:1\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#5c6478\">СЬОГОДНІ 09:14<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size:12.5px;line-height:1.5;color:#dde1ee;text-wrap:pretty\">Пройди по всіх файлах у src<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#5c6478\">9 КРОКІВ · $0.31 · ПОЧАТО 25 ЛИП<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px;padding-left:2px\">\n            <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#4a5164\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M12 4v16M6 14l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ЛІЧБА ПОЧАЛАСЬ ЗАНОВО СЬОГОДНІ<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:11px;opacity:0.55\">\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <span style=\"width:6px;height:6px;border-radius:50%;background:#5c6478\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#5c6478\">ЗУПИНЕНО<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#e9a3d0\">PLANNER<\u002Fspan>\n              <span style=\"flex:1\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#5c6478\">24 ЛИП 09:40<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size:12.5px;line-height:1.5;color:#dde1ee;text-wrap:pretty\">Розбий міграцію на кроки<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#5c6478\">ЗНИКАЄ СЬОГОДНІ · ДО НЬОГО НІХТО НЕ ВЕРТАВСЯ<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:5px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ЖИВА РОЗМОВА НЕ ЗНИКАЄ: ДОПИСАНЕ ПЕРЕСУВАЄ ВСІ ТРИДЦЯТЬ ДНІВ, А НЕ ДОДАЄ ЩЕ ОДИН РЯДОК<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ЛІЧБА ВІД ПЕРШОЇ РЕПЛІКИ ЗАБИРАЛА Б РОЗМОВУ, ЯКУ ЩОЙНО ВЕЛИ — ЦЕ Й БУЛО Б ПОМИЛКОЮ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ПРАВИЛО НЕ МІНЯЛОСЬ: ТРИДЦЯТЬ ДНІВ БЕЗ ЖИТТЯ, А НЕ ТРИДЦЯТЬ ДНІВ ВІД НАРОДЖЕННЯ<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"23k\" style=\"display:flex;flex-direction:column;gap:12px\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;max-width:1100px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:#38a3ff;background:#12151f;border:1px solid #262b3a;border-radius:6px;padding:3px 8px;flex-shrink:0\">23k<\u002Fspan>\n      <span style=\"font-size:15px;font-weight:600;flex-shrink:0\">Репліка людини в потоці<\u002Fspan>\n      <span style=\"font-size:13px;line-height:1.6;color:#838ba6;text-wrap:pretty\">У потоці рівноправна розмова, тому репліка людини підписана так само, як підписані репліки агентів: крапка, ім'я, час. Ім'я — <b style=\"color:#dde1ee;font-weight:600\">«ВИ»<\u002Fb>, час без номера кроку («ВИ · 10:21», не «КРОК 2 · 10:22»): кроки рахує обхід, а репліка людини кроком не є. Колір крапки — сам колір тексту (#dde1ee): людина не сфера в графі, у неї немає ребра й немає ходу, тому вона не бере колір із палітри агентів і не сперечається з жодним із восьми. Знака розриву між репліками немає: запис продовжується (23j). Про пам'ять потік теж не говорить — хід несе нитку свого агента сам (<a href=\"#23i\">23i<\u002Fa>), і казати про це впоперек розмови нема чого: застосунок говорить лише тоді, коли щось не сталося.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"width:1280px;flex-shrink:0;background:#262b3a;background-image:radial-gradient(circle, rgba(255,255,255,0.14) 1px, transparent 1px);background-size:8px 8px;background-position:3px 3px;padding:35px;display:flex;gap:28px;box-sizing:border-box;border-radius:4px\">\n\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">ДОПИСАНО ПІД ПРОЧИТАНИМ ЗАПУСКОМ<\u002Fspan>\n        <div style=\"width:380px;background:#12151f;border-radius:10px;overflow:hidden;box-sizing:border-box\">\n          <div style=\"display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid #1c202c;background:#141824\">\n            <span style=\"width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade80\"><\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1.5px;color:#aab3cc\">ІДЕ<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:14px 16px;display:flex;flex-direction:column;gap:9px\">\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <div style=\"display:flex;align-items:center;gap:7px\">\n                <span style=\"width:6px;height:6px;border-radius:50%;background:#dde1ee\"><\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#dde1ee\">ВИ<\u002Fspan>\n                <span style=\"flex:1\"><\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#5c6478\">14:12<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:10px\">\n                <span style=\"font-size:12.5px;line-height:1.5;color:#dde1ee;text-wrap:pretty\">Відкрий PR на гілку fix/session<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:10px\">\n              <div style=\"display:flex;align-items:center;gap:7px\">\n                <span style=\"width:6px;height:6px;border-radius:50%;background:#b18aff\"><\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#b18aff\">EDITOR<\u002Fspan>\n                <span style=\"flex:1\"><\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#5c6478\">КРОК 3 · 14:13<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"font-size:12.5px;line-height:1.5;color:#aab3cc;text-wrap:pretty\">Тест <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#dde1ee\">session.spec.ts<\u002Fspan> упав — PR не відкриваю.<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#4a5164\">КОД 1 · КІНЕЦЬ ХОДУ<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <div style=\"display:flex;align-items:center;gap:7px\">\n                <span style=\"width:6px;height:6px;border-radius:50%;background:#dde1ee\"><\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#dde1ee\">ВИ<\u002Fspan>\n                <span style=\"flex:1\"><\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#5c6478\">10:21<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"background:#171b26;border:1px solid #2c3550;border-radius:10px;padding:10px\">\n                <span style=\"font-size:12.5px;line-height:1.5;color:#dde1ee;text-wrap:pretty\">Полагодь тест, який упав<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:10px\">\n              <div style=\"display:flex;align-items:center;gap:7px\">\n                <span style=\"width:6px;height:6px;border-radius:50%;background:#e8c46a\"><\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#e8c46a\">TESTER<\u002Fspan>\n                <span style=\"flex:1\"><\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#aab3cc\">КРОК 4 · 10:21<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"font-size:12.5px;line-height:1.5;color:#aab3cc;text-wrap:pretty\">Читаю <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#dde1ee\">session.spec.ts<\u002Fspan> і вчорашній вивід…<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">ЧОМУ КОЛІР ТЕКСТУ, А НЕ ДЕВ'ЯТИЙ ІЗ ПАЛІТРИ<\u002Fspan>\n        <div style=\"width:380px;background:#12151f;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box\">\n          <div style=\"display:flex;flex-direction:column;gap:9px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:12px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490\">ВІСІМ КОЛЬОРІВ АГЕНТІВ — КОЛІР СФЕРИ Й РЕБРА<\u002Fspan>\n            <div style=\"display:flex;gap:7px;align-items:center\">\n              <span style=\"width:14px;height:14px;border-radius:50%;background:#b18aff\"><\u002Fspan>\n              <span style=\"width:14px;height:14px;border-radius:50%;background:#e9a3d0\"><\u002Fspan>\n              <span style=\"width:14px;height:14px;border-radius:50%;background:#e8c46a\"><\u002Fspan>\n              <span style=\"width:14px;height:14px;border-radius:50%;background:#6fd3d8\"><\u002Fspan>\n              <span style=\"width:14px;height:14px;border-radius:50%;background:#f0a5ac\"><\u002Fspan>\n              <span style=\"width:14px;height:14px;border-radius:50%;background:#4ade80\"><\u002Fspan>\n              <span style=\"width:14px;height:14px;border-radius:50%;background:#38a3ff\"><\u002Fspan>\n              <span style=\"width:14px;height:14px;border-radius:50%;background:#aab3cc\"><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:9px;background:#171b26;border:1px solid #2c3550;border-radius:10px;padding:12px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#dde1ee\">ЛЮДИНА — КОЛІР ТЕКСТУ<\u002Fspan>\n            <div style=\"display:flex;align-items:center;gap:9px\">\n              <span style=\"width:14px;height:14px;border-radius:50%;background:#dde1ee\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1px;color:#dde1ee\">#dde1ee<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:5px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ДЕВ'ЯТИЙ КОЛІР ЗРОБИВ БИ ЛЮДИНУ ЩЕ ОДНИМ АГЕНТОМ — А В НЕЇ НЕМАЄ НІ СФЕРИ, НІ РЕБРА, НІ ХОДУ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">СИНІЙ ЗАЙНЯТИЙ: ЦЕ ГОЛОС ЗАСТОСУНКУ Й АКЦЕНТ НАТИСКНОГО (42a)<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">КОЛІР ТЕКСТУ ЧЕСНИЙ: РЕПЛІКА ЛЮДИНИ Й Є ТЕКСТ, ЯКИЙ ВОНА НАПИСАЛА<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ДАТА В ГОЛОВІ РЕПЛІКИ Й Є ВЕСЬ ЗНАК ТОГО, ЩО МІЖ ДВОМА РЕПЛІКАМИ ПРОЙШОВ ТИЖДЕНЬ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ЧАС БЕЗ НОМЕРА КРОКУ: НУМЕРУЮТЬСЯ КРОКИ ОБХОДУ, А РЕПЛІКА ЛЮДИНИ ЇХ НЕ ВИТРАЧАЄ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">СМУГА ЗВЕРХУ ЛИШАЄТЬСЯ ТОЮ САМОЮ (23e) — ПОТІК І ДАЛІ ПОКАЗУЄ НЕ «ВСЕ»<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"23l\" style=\"display:flex;flex-direction:column;gap:12px\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;max-width:1100px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:#38a3ff;background:#12151f;border:1px solid #262b3a;border-radius:6px;padding:3px 8px;flex-shrink:0\">23l<\u002Fspan>\n      <span style=\"font-size:15px;font-weight:600;flex-shrink:0\">Модель не сказала нічого<\u002Fspan>\n      <span style=\"font-size:13px;line-height:1.6;color:#838ba6;text-wrap:pretty\">П'яте речення лишається п'ятим — воно про подію, якої немає в жодному з чотирьох. Хід не «не почався» (4e: нічого не надіслано, кроку в записі немає) і не «упав» (24d: є помилка, яку видно). Тут хід відбувся цілком: питання пішло, модель відповіла, відповідь порожня. Речення каже саме це — <b style=\"color:#dde1ee;font-weight:600\">хід відбувся, а сказано нічого<\u002Fb>, — і більше під ним нічого не стоїть: крок і гроші лежать у записі, де їх і шукають, а під реченням читалися як зайве. Слова застосунку, тому на рисці (4g), не в картці; повторити просить та сама дія, що всюди.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"width:1280px;flex-shrink:0;background:#262b3a;background-image:radial-gradient(circle, rgba(255,255,255,0.14) 1px, transparent 1px);background-size:8px 8px;background-position:3px 3px;padding:35px;display:flex;gap:28px;box-sizing:border-box;border-radius:4px\">\n\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">У ПОТОЦІ<\u002Fspan>\n        <div style=\"width:380px;background:#12151f;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <div style=\"display:flex;align-items:center;gap:7px\">\n              <span style=\"width:6px;height:6px;border-radius:50%;background:#dde1ee\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#dde1ee\">ВИ<\u002Fspan>\n              <span style=\"flex:1\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#5c6478\">10:44<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:10px\">\n              <span style=\"font-size:12.5px;line-height:1.5;color:#dde1ee;text-wrap:pretty\">Підсумуй, що змінилось у міграції<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:7px;align-items:center;padding:6px 0\">\n            <div style=\"align-self:stretch;display:flex;align-items:center;gap:10px\">\n              <span style=\"flex:1;height:1px;background:#1c202c\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490;white-space:nowrap\">МОДЕЛЬ НЕ СКАЗАЛА НІЧОГО<\u002Fspan>\n              <span style=\"flex:1;height:1px;background:#1c202c\"><\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;border:1px solid #262b3a;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;color:#aab3cc;margin-top:2px\">\n              <svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6b7490\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6\"><\u002Fpath><\u002Fsvg>\n              СПИТАТИ ЩЕ РАЗ\n            <\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:5px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">РЕЧЕННЯ НА РИСЦІ, БО ЦЕ СЛОВА ЗАСТОСУНКУ (4g) — КАРТКИ НЕМА, БО НІЧИЇХ СЛІВ НЕМА<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ЦІНИ Й КРОКА ПІД РЕЧЕННЯМ НЕМА: ВОНО ВЖЕ КАЖЕ, ЩО ХІД ВІДБУВСЯ, А ЧИСЛА СТОЯТЬ У ЗАПИСІ<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">ЧОМУ НЕ ЗЛИВАЄТЬСЯ З ЧОТИРМА<\u002Fspan>\n        <div style=\"width:380px;background:#12151f;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box\">\n          <div style=\"display:flex;flex-direction:column;gap:7px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:11px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490\">4e · ХІД НЕ ПОЧАВСЯ<\u002Fspan>\n            <span style=\"font-size:12px;line-height:1.55;color:#aab3cc;text-wrap:pretty\">Нічого не надіслано, кроку в записі немає, ціни немає.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:7px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:11px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#f0a5ac\">24d · УПАВ<\u002Fspan>\n            <span style=\"font-size:12px;line-height:1.55;color:#aab3cc;text-wrap:pretty\">Є помилка, і її видно — кінець кроку названий словом (26b).<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:7px;background:#171b26;border:1px solid #2c3550;border-radius:10px;padding:11px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#dde1ee\">23l · СКАЗАЛА НІЧОГО<\u002Fspan>\n            <span style=\"font-size:12px;line-height:1.55;color:#aab3cc;text-wrap:pretty\">Хід відбувся, помилки немає, крок є, гроші витрачені — і сказано нуль слів.<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7;padding-top:2px\">ТРИ РІЗНІ ПОДІЇ, ТРИ РІЗНІ НАСЛІДКИ ДЛЯ ЗАПИСУ — ОДНЕ РЕЧЕННЯ НА ВСІ БРЕХАЛО Б ПРО ГРОШІ<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">У РЯДКУ ІСТОРІЇ Й У ЗАПИСІ<\u002Fspan>\n        <div style=\"width:380px;background:#12151f;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box\">\n          <div style=\"display:flex;flex-direction:column;gap:7px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:11px\">\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <span style=\"width:6px;height:6px;border-radius:50%;background:#5c6478\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#e9a3d0\">PLANNER<\u002Fspan>\n              <span style=\"flex:1\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#5c6478\">10:44 · 3 c<\u002Fspan>\n              <span style=\"width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center\"><svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#4a5164\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6 6 18\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size:12.5px;line-height:1.5;color:#dde1ee;text-wrap:pretty\">Підсумуй, що змінилось у міграції<\u002Fspan>\n            <div style=\"display:flex;align-items:center;gap:6px\">\n              <span style=\"width:5px;height:5px;border-radius:50%;background:#e9a3d0\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#5c6478;padding-left:3px\">2 КРОКИ · $0.0008<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:5px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">СТАНУ В РЯДКУ НЕМА: НЕ «УПАВ» І НЕ «ІДЕ» — ЗВИЧАЙНИЙ ЗАВЕРШЕНИЙ ПОТІК, І ЦЕ ПРАВДА<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">КРОК ВСЕРЕДИНІ РОЗКРИВАЄТЬСЯ ЯК УСІ (24c): ЗАПИТ Є, ВІДПОВІДЬ ПОРОЖНЯ, ВИКЛИКІВ НЕМА<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ПОРОЖНЯ ВІДПОВІДЬ ДВІЧІ ПІДРЯД — ВЖЕ ІНША РІЧ І ОКРЕМЕ ПИТАННЯ: ЦЕ НЕ ПОДІЯ, А ЗВИЧКА МОДЕЛІ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ДІЯ ПІД РЕЧЕННЯМ СТОЇТЬ НЕ ЛИШЕ ТУТ, А ПІД КОЖНИМ ОБІРВАНИМ ХОДОМ — <a href=\"#23m\">23m<\u002Fa><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"23m\" style=\"display:flex;flex-direction:column;gap:12px\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;max-width:1100px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:#38a3ff;background:#12151f;border:1px solid #262b3a;border-radius:6px;padding:3px 8px;flex-shrink:0\">23m<\u002Fspan>\n      <span style=\"font-size:15px;font-weight:600;flex-shrink:0\">«Спитати ще раз» під кожною аварією<\u002Fspan>\n      <span style=\"font-size:13px;line-height:1.6;color:#838ba6;text-wrap:pretty\">Третього не дано: хід або відповів, або обірвався. Тому дія стоїть не тільки під «МОДЕЛЬ НЕ СКАЗАЛА НІЧОГО» (<a href=\"#23l\">23l<\u002Fa>), а під кожним словом застосунку про обірваний хід — і під карткою «хід не почався» (<a href=\"#4e\">4e<\u002Fa>) теж, бо ключ, який людина щойно поправила, має продовжити один натиск. Питання те саме, агент той самий, повторити — це натиск замість набирання наново. <b style=\"color:#dde1ee;font-weight:600\">Слова дія бере із запису, за ідентифікатором питання<\u002Fb> — одне джерело на всі повтори: поле порожніє тієї миті, коли питання пішло (<a href=\"#23r\">23r<\u002Fa>), тому 4e перестала бути винятком, а «більше за стелю» (49b) узяла цю дію разом з усіма — винятків не лишилось зовсім. <b style=\"color:#dde1ee;font-weight:600\">Одна дія на крок, і живе вона лише під останнім сказаним.<\u002Fb> Слово на рисці — за кінцями ходів: коли він у всіх один, риска каже саме його («ЗУПИНЕНО»), а «КРОК ОБІРВАВСЯ» лишається на випадок, коли спільного слова немає. Чому дія одна на крок, а не на хід: обрив ламає крок цілим — щойно один хід упав, кожен інший, який ще в дорозі, спиняється тієї ж миті й приходить у запис із «ЗУПИНЕНО», хоч рука нічого не натискала, і після обриву не починається нічого (<a href=\"#4f\">4f<\u002Fa>). Обривів у питанні буває більше за один: рука зупинила крок, натиснула «СПИТАТИ ЩЕ РАЗ», прогулянка пішла далі й обірвалась знову — тому <b style=\"color:#dde1ee;font-weight:600\">дія піднімає ходи останньої прогулянки цього питання, а не весь злам:<\u002Fb> піднятий хід — закрита справа, усе, що перед останньою прогулянкою, або відповіло, або вже було піднято, і крок у записі називає прогулянку, в якій він біг.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"width:1690px;flex-shrink:0;background:#262b3a;background-image:radial-gradient(circle, rgba(255,255,255,0.14) 1px, transparent 1px);background-size:8px 8px;background-position:3px 3px;padding:35px;display:flex;gap:28px;box-sizing:border-box;border-radius:4px\">\n\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">П'ЯТЬ ОБІРВАНИХ КІНЦІВ · ОДНА ДІЯ<\u002Fspan>\n        <div style=\"width:380px;background:#12151f;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box\">\n          <div style=\"display:flex;flex-direction:column;gap:7px;align-items:center\">\n            <div style=\"align-self:stretch;display:flex;align-items:center;gap:10px\">\n              <span style=\"flex:1;height:1px;background:#1c202c\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490;white-space:nowrap\">ВІДПОВІДЬ НЕ ПРИЙШЛА<\u002Fspan>\n              <span style=\"flex:1;height:1px;background:#1c202c\"><\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;border:1px solid #262b3a;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;color:#aab3cc\">\n              <svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6b7490\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6\"><\u002Fpath><\u002Fsvg>\n              СПИТАТИ ЩЕ РАЗ\n            <\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:7px;align-items:center\">\n            <div style=\"align-self:stretch;display:flex;align-items:center;gap:10px\">\n              <span style=\"flex:1;height:1px;background:#1c202c\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490;white-space:nowrap\">ЗУПИНЕНО<\u002Fspan>\n              <span style=\"flex:1;height:1px;background:#1c202c\"><\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;border:1px solid #262b3a;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;color:#aab3cc\">\n              <svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6b7490\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6\"><\u002Fpath><\u002Fsvg>\n              СПИТАТИ ЩЕ РАЗ\n            <\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:7px;align-items:center\">\n            <div style=\"align-self:stretch;display:flex;align-items:center;gap:10px\">\n              <span style=\"flex:1;height:1px;background:#1c202c\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490;white-space:nowrap\">ВІДПОВІДЬ УПЕРЛАСЯ В СТЕЛЮ · 4096 ТКН<\u002Fspan>\n              <span style=\"flex:1;height:1px;background:#1c202c\"><\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;border:1px solid #262b3a;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;color:#aab3cc\">\n              <svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6b7490\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6\"><\u002Fpath><\u002Fsvg>\n              СПИТАТИ ЩЕ РАЗ\n            <\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:7px;align-items:center\">\n            <div style=\"align-self:stretch;display:flex;align-items:center;gap:10px\">\n              <span style=\"flex:1;height:1px;background:#1c202c\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490;white-space:nowrap\">ВИЧЕРПАНО МАКСИМУМ ВИКЛИКІВ · 8<\u002Fspan>\n              <span style=\"flex:1;height:1px;background:#1c202c\"><\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;border:1px solid #262b3a;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;color:#aab3cc\">\n              <svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6b7490\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6\"><\u002Fpath><\u002Fsvg>\n              СПИТАТИ ЩЕ РАЗ\n            <\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:7px;align-items:center\">\n            <div style=\"align-self:stretch;display:flex;align-items:center;gap:10px\">\n              <span style=\"flex:1;height:1px;background:#1c202c\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490;white-space:nowrap\">МОДЕЛЬ НЕ СКАЗАЛА НІЧОГО<\u002Fspan>\n              <span style=\"flex:1;height:1px;background:#1c202c\"><\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;border:1px solid #262b3a;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;color:#aab3cc\">\n              <svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6b7490\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6\"><\u002Fpath><\u002Fsvg>\n              СПИТАТИ ЩЕ РАЗ\n            <\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:1px;background:#1c202c\"><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:5px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">РЕЦЕПТ ТОЙ САМИЙ, ЩО В <a href=\"#23l\">23l<\u002Fa>: РИСКА, ПІД НЕЮ ДІЯ ПО ЦЕНТРУ, БЕЗ КАРТКИ Й БЕЗ ЦІНИ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">СЛОВА РІЗНІ, ПРИЧИНИ РІЗНІ — ВИХІД ОДИН: ТЕ САМЕ ПИТАННЯ ТОМУ САМОМУ АГЕНТОВІ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ЧИСЛО НА РИСЦІ НЕ ГРУПУЄТЬСЯ — «4096 ТКН», ЯК ВПИСАЛА РУКА; ЧИСЛА В ЗАПИСІ НЕМА — «— ТКН» (<a href=\"#49c\">49c<\u002Fa>)<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">ПІД КАРТКОЮ 4e · БЕЗ СВОГО РЯДКА<\u002Fspan>\n        <div style=\"width:380px;background:#12151f;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box\">\n          <div style=\"display:flex;flex-direction:column;gap:9px;background:#1f1a20;border:1px solid #4a2530;border-radius:10px;padding:12px\">\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#f0a5ac\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"flex-shrink:0\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8v5M12 16.5h.01\"><\u002Fpath><\u002Fsvg>\n              <span style=\"flex:1;font-size:12.5px;font-weight:600;color:#f0a5ac\">Хід не почався<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#f0a5ac\">НЕМА КЛЮЧА<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size:12.5px;line-height:1.6;color:#aab3cc;text n>\n            <\u002Fdiv>\n            <span style=\"display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;border:1px solid #262b3a;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;color:#aab3cc\">\n              <svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6b7490\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6\"><\u002Fpath><\u002Fsvg>\n              СПИТАТИ ЩЕ РАЗ\n            <\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:5px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ЛАМАЄТЬСЯ КРОК ПРОГУЛЯНКИ, А НЕ ОДИН ХІД У НЬОМУ: СЛОВО РАЗ, ДІЯ ОДНА<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">КІНЕЦЬ У ВСІХ ОДИН — РИСКА КАЖЕ ЙОГО СЛОВАМИ: «ЗУПИНЕНО», А НЕ «КРОК ОБІРВАВСЯ»<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">КІНЦІ РІЗНІ — СПІЛЬНОГО СЛОВА НЕМА, І ТОДІ СТОЇТЬ «КРОК ОБІРВАВСЯ»: ЗАГАЛЬНЕ ЧЕСНІШЕ, НІЖ ОДНЕ З ТРЬОХ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ПРИЧИНИ РІЗНІ — РИСКА ВСЕ ОДНО ОДНА: ТРИ РИСКИ ПОСПІЛЬ ЧИТАЛИСЬ БИ ЯК ТРИ АВАРІЇ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ПООДИНЦІ КІНЦІ НАЗВАНІ ТАМ, ДЕ ЇХ ШУКАЮТЬ — У ЗАПИСІ КРОКУ (<a href=\"#24c\">24c<\u002Fa>, 26b)<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">ЖИВЕ ЛИШЕ ПІД ОСТАННІМ СКАЗАНИМ<\u002Fspan>\n        <div style=\"width:380px;background:#12151f;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <div style=\"display:flex;align-items:center;gap:7px\">\n              <span style=\"width:6px;height:6px;border-radius:50%;background:#dde1ee\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#dde1ee\">ВИ<\u002Fspan>\n              <span style=\"flex:1\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#5c6478\">10:44<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:10px\">\n              <span style=\"font-size:12.5px;line-height:1.5;color:#dde1ee;text-wrap:pretty\">Підсумуй, що змінилось у міграції<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;padding:4px 0\">\n            <span style=\"flex:1;height:1px;background:#1c202c\"><\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490;white-space:nowrap\">МОДЕЛЬ НЕ СКАЗАЛА НІЧОГО<\u002Fspan>\n            <span style=\"flex:1;height:1px;background:#1c202c\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <div style=\"display:flex;align-items:center;gap:7px\">\n              <span style=\"width:6px;height:6px;border-radius:50%;background:#e9a3d0\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#e9a3d0\">PLANNER<\u002Fspan>\n              <span style=\"flex:1\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#5c6478\">10:45<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:10px\">\n              <span style=\"font-size:12.5px;line-height:1.5;color:#dde1ee;text-wrap:pretty\">Міграція перенесла три таблиці й перейменувала два ключі. Розписав нижче.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:5px;padding-top:2px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ПОВТОР УДАВСЯ — ДІЯ ЗНИКЛА, РИСКА ЛИШИЛАСЯ ЯК ФАКТ ТОГО, ЩО ПЕРШИЙ ХІД БУВ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ТАК САМО ЗНИКАЄ ВІД НОВОГО ПИТАННЯ ЛЮДИНИ: ПІД НЕОСТАННІМ ДІЇ НЕ БУВАЄ НІКОЛИ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ЯКЩО ПОВТОР ТЕЖ ОБІРВАВСЯ — НОВА РИСКА, НОВА ДІЯ ПІД НЕЮ, СТАРА БЕЗ ДІЇ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">СЛОВА ДІЯ БЕРЕ ІЗ ЗАПИСУ, ЗА ІДЕНТИФІКАТОРОМ ПИТАННЯ: ПОЛЕ ПОРОЖНІЄ ТІЄЇ Ж МИТІ, КОЛИ ПИТАННЯ ПІШЛО (<a href=\"#23r\">23r<\u002Fa>)<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"23r\" style=\"display:flex;flex-direction:column;gap:12px\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;max-width:1100px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:#38a3ff;background:#12151f;border:1px solid #262b3a;border-radius:6px;padding:3px 8px;flex-shrink:0\">23r<\u002Fspan>\n      <span style=\"font-size:15px;font-weight:600;flex-shrink:0\">Поле порожніє тієї миті, коли питання пішло<\u002Fspan>\n      <span style=\"font-size:13px;line-height:1.6;color:#838ba6;text-wrap:pretty\"><b style=\"color:#dde1ee;font-weight:600\">Завжди, без винятку.<\u002Fb> Слова питання в цю мить стоять уже у двох місцях: карткою людини в потоці — вона лягла тієї ж миті, коли її поставили (<a href=\"#23k\">23k<\u002Fa>) — і питанням у записі, яке пишеться ще до ходу (<a href=\"#23j\">23j<\u002Fa>). Поле було третьою копією того, що ніде не губиться, і повертати її означало давати руці роботу: питання, яке не почалось (<a href=\"#4e\">4e<\u002Fa>), приходило назад у поле, а вставлений абзац доводилось вичищати перед кожним наступним рухом. Тому «СПИТАТИ ЩЕ РАЗ» бере слова <b style=\"color:#dde1ee;font-weight:600\">із запису, за ідентифікатором питання<\u002Fb> — рівно так, як кожен інший повтор (<a href=\"#23m\">23m<\u002Fa>), — і 4e перестає бути винятком. Ціна названа праворуч: два випадки родини лагодяться рукою в іншому місці, і жоден із них поля не потребує.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"width:1674px;flex-shrink:0;background:#262b3a;background-image:radial-gradient(circle, rgba(255,255,255,0.14) 1px, transparent 1px);background-size:8px 8px;background-position:3px 3px;padding:35px;display:flex;gap:28px;box-sizing:border-box;border-radius:4px\">\n\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#a9808a\">БУЛО · СЛОВА ВЕРТАЛИСЯ В ПОЛЕ<\u002Fspan>\n        <div style=\"width:380px;background:#12151f;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box\">\n          <div style=\"display:flex;flex-direction:column;gap:9px;background:#1f1a20;border:1px solid #4a2530;border-radius:10px;padding:12px\">\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#f0a5ac\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"flex-shrink:0\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8v5M12 16.5h.01\"><\u002Fpath><\u002Fsvg>\n              <span style=\"flex:1;font-size:12.5px;font-weight:600;color:#f0a5ac\">Хід не почався<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#f0a5ac\">НЕ ВІДПОВІДАЄ<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size:12.5px;line-height:1.6;color:#aab3cc;text-wrap:pretty\">Локальний провайдер не відповідає за своєю адресою. Перевірте, чи він запущений.<\u002Fspan>\n            <div style=\"display:flex;align-items:center;gap:12px\">\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#4a5164\">Нічого не надіслано<\u002Fspan>\n              <span style=\"flex:1\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#dde1ee\">ВІДКРИТИ ПРОВАЙДЕРА<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height:1px;background:#1c202c\"><\u002Fdiv>\n          <div style=\"background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:9px 10px;font-size:12.5px;line-height:1.5;color:#dde1ee;text-wrap:pretty\">Прогони тести пакета auth і скажи, що впало. Дивись у tests/auth і tests/session. Якщо впало на токенах — перевір, чи не протух ключ у фікстурах. Snapshot-тести не чіпай, вони навмисне червоні. Наприкінці дай список файлів, які треба поправити.<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px\">\n            <span style=\"flex:1;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164\">⌘↵ НАДІСЛАТИ<\u002Fspan>\n            <span style=\"width:28px;height:28px;border-radius:8px;background:#1b1f2c;display:flex;align-items:center;justify-content:center\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5c6478\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 19V5M5 12l7-7 7 7\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:5px;padding-top:2px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ЖИВИЙ ПРОГІН: ПРОВАЙДЕР НЕ БУВ ЗАПУЩЕНИЙ, І РУКА ПОМІНЯЛА ЙОГО ДВІЧІ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ЩОРАЗУ ТЕКСТ ПИТАННЯ ПОВЕРТАВСЯ В ПОЛЕ — А ЦЕ БУВ АБЗАЦ НА П'ЯТЬ РЕЧЕНЬ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ПЕРЕД КОЖНИМ НАСТУПНИМ РУХОМ ЙОГО ВИЧИЩАЛИ РУКОЮ: ТРИ ВІДМОВИ — ТРИ ВИЧИЩАННЯ<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">СТАЛО · ПОЛЕ ПОРОЖНЄ, СЛОВА В ПОТОЦІ<\u002Fspan>\n        <div style=\"width:380px;background:#12151f;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <div style=\"display:flex;align-items:center;gap:7px\">\n              <span style=\"width:6px;height:6px;border-radius:50%;background:#dde1ee\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#dde1ee\">ВИ<\u002Fspan>\n              <span style=\"flex:1\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#5c6478\">14:26<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:10px\">\n              <span style=\"font-size:12.5px;line-height:1.5;color:#dde1ee;text-wrap:pretty\">Прогони тести пакета auth і скажи, що впало. Дивись у tests/auth і tests/session. Якщо впало на токенах — перевір, чи не протух ключ у фікстурах. Snapshot-тести не чіпай, вони навмисне червоні. Наприкінці дай список файлів, які треба поправити.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:9px;background:#1f1a20;border:1px solid #4a2530;border-radius:10px;padding:12px\">\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#f0a5ac\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"flex-shrink:0\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8v5M12 16.5h.01\"><\u002Fpath><\u002Fsvg>\n              <span style=\"flex:1;font-size:12.5px;font-weight:600;color:#f0a5ac\">Хід не почався<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#f0a5ac\">НЕ ВІДПОВІДАЄ<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:12px\">\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#4a5164\">Нічого не надіслано<\u002Fspan>\n              <span style=\"flex:1\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#dde1ee\">ВІДКРИТИ ПРОВАЙДЕРА<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:center\">\n            <span style=\"display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;border:1px solid #262b3a;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;color:#aab3cc\">\n              <svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6b7490\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6\"><\u002Fpath><\u002Fsvg>\n              СПИТАТИ ЩЕ РАЗ\n            <\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:1px;background:#1c202c\"><\u002Fdiv>\n          <div style=\"background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:9px 10px;min-height:40px;font-size:12.5px;color:#838ba6\">Питання для TESTER…<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px\">\n            <span style=\"flex:1;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164\">⌘↵ НАДІСЛАТИ<\u002Fspan>\n            <span style=\"width:28px;height:28px;border-radius:8px;background:#1b1f2c;display:flex;align-items:center;justify-content:center\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5c6478\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 19V5M5 12l7-7 7 7\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:5px;padding-top:2px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ПОЛЕ СПОРОЖНІЛО В ТУ МИТЬ, КОЛИ ПИТАННЯ ПІШЛО — А НЕ КОЛИ ПРИЙШЛА ВІДПОВІДЬ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">РЯДОК ПІД ПОЛЕМ ТОЙ САМИЙ, ЩО ВСЮДИ (<a href=\"#23m\">23m<\u002Fa>): ПРО НАДСИЛАННЯ, А НЕ ПРО СТАН<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">НЕДОПИСАНЕ В ПОЛІ НАЛЕЖИТЬ ПОТОКОВІ Й ЛИШАЄТЬСЯ (23e) — ПОРОЖНІЄ САМЕ НАДІСЛАНЕ<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">СЛОВА ЛЯГЛИ ДВІЧІ, ЩЕ ДО ХОДУ<\u002Fspan>\n        <div style=\"width:380px;background:#12151f;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:11px;box-sizing:border-box\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"display:flex;align-items:flex-start;gap:9px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:11px\">\n              <span style=\"width:6px;height:6px;border-radius:50%;background:#dde1ee;margin-top:4px;flex-shrink:0\"><\u002Fspan>\n              <span style=\"flex:1;display:flex;flex-direction:column;gap:3px\">\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#dde1ee\">КАРТКА В ПОТОЦІ<\u002Fspan>\n                <span style=\"font-size:12px;line-height:1.55;color:#aab3cc;text-wrap:pretty\">Лягла тієї ж миті, коли питання поставили (<a href=\"#23k\">23k<\u002Fa>). Звідси слова копіюють, коли хочуть їх поправити.<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:flex-start;gap:9px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:11px\">\n              <span style=\"width:6px;height:6px;border-radius:50%;background:#38a3ff;margin-top:4px;flex-shrink:0\"><\u002Fspan>\n              <span style=\"flex:1;display:flex;flex-direction:column;gap:3px\">\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#dde1ee\">ПИТАННЯ В ЗАПИСІ<\u002Fspan>\n                <span style=\"font-size:12px;line-height:1.55;color:#aab3cc;text-wrap:pretty\">Пишеться ще до ходу (<a href=\"#23j\">23j<\u002Fa>) і має свій ідентифікатор. Звідси їх бере «СПИТАТИ ЩЕ РАЗ».<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:flex-start;gap:9px;border:1px dashed #2c3341;border-radius:10px;padding:11px\">\n              <span style=\"width:6px;height:6px;border-radius:50%;border:1px solid #4a5164;margin-top:4px;flex-shrink:0\"><\u002Fspan>\n              <span style=\"flex:1;display:flex;flex-direction:column;gap:3px\">\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490\">ПОЛЕ · ТРЕТЯ КОПІЯ<\u002Fspan>\n                <span style=\"font-size:12px;line-height:1.55;color:#6b7490;text-wrap:pretty\">Не тримаємо. Пунктир означає те, чого немає (41a): копія того, що ніде не загубилось, — це робота руці, а не страховка.<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height:1px;background:#1c202c\"><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:9px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:11px\">\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490;flex:1\">ЩО ПІДНІМАЄ ПОВТОР<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#38a3ff\">ІЗ ЗАПИСУ<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:4px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#aab3cc;line-height:1.6\">\n              <div><span style=\"color:#5c6478\">питання<\u002Fspan> q-8f2a · 14:26<\u002Fdiv>\n              <div><span style=\"color:#5c6478\">агент<\u002Fspan> TESTER<\u002Fdiv>\n              <div><span style=\"color:#5c6478\">слова<\u002Fspan> 5 речень · 412 символів<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:5px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ОДНЕ ДЖЕРЕЛО НА ВСІ ПОВТОРИ (<a href=\"#23m\">23m<\u002Fa>) — І ТОМУ ОДНЕ РЕЧЕННЯ ПРО НИХ, БЕЗ 4e ОКРЕМО<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ОБІРВАНИЙ ХІД У НИТКУ НЕ ЛІГ (<a href=\"#23i\">23i<\u002Fa>): ПАРУ ПОКЛАДЕ ТОЙ, ЩО ВІДПОВІСТЬ<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">ЦІНА · ДВА, ЩО ЛАГОДЯТЬ РУКОЮ В ІНШОМУ МІСЦІ<\u002Fspan>\n        <div style=\"width:380px;background:#12151f;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:11px;box-sizing:border-box\">\n          <div style=\"display:flex;flex-direction:column;gap:8px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:11px\">\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490;flex:1\">49b · БІЛЬШЕ ЗА СТЕЛЮ<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#dde1ee\">ВІДКРИТИ МОДЕЛЬ<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size:12px;line-height:1.55;color:#aab3cc;text-wrap:pretty\">Рука йде піднімати стелю контексту й вертається. Повтор стоїть і тут: піднята стеля пускає ті самі слова, а бере їх дія із запису — винятку в 23m немає.<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ХОЧЕТЕ КОРОТШИХ СЛІВ — КОПІЮЄТЕ З ВЛАСНОЇ КАРТКИ В ПОТОЦІ<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:11px\">\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490;flex:1\">4e · НЕ ЗАПОВНЕНО<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#dde1ee\">ВІДКРИТИ НАЛАШТУВАННЯ<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size:12px;line-height:1.55;color:#aab3cc;text-wrap:pretty\">Рука йде в таб агента, заповнює поле, вертається — і натискає той самий повтор. Набирати нічого: слова лежать у записі, а не в полі.<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ТОЙ САМИЙ ШЛЯХ, ЩО В «НЕМА КЛЮЧА»: ПРИЧИНУ ЛАГОДЯТЬ, ХІД ПРОДОВЖУЮТЬ НАТИСКОМ<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:1px;background:#1c202c\"><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:5px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ОКРЕМОЇ ДІЇ «ПОКЛАСТИ ПИТАННЯ В ПОЛЕ» НЕМА: ВОНА Б ЖИЛА ПІД ДВОМА КАРТКАМИ З УСІЄЇ РОДИНИ Й СТАЛА Б ДРУГОЮ КНОПКОЮ ТАМ, ДЕ ВЖЕ Є ВЛАСНА<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ТИХОГО ПОВЕРНЕННЯ ТЕЖ НЕМА: САМЕ ВОНО Й БУЛО ТИМ, ЩО ВИЧИЩАЛИ РУКОЮ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ПРАВИЛО ОДНЕ Й БЕЗ ВИНЯТКІВ — ТОМУ ЙОГО НЕ ТРЕБА ТРИМАТИ В ГОЛОВІ<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"23n\" style=\"display:flex;flex-direction:column;gap:12px\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;max-width:1100px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:#38a3ff;background:#12151f;border:1px solid #262b3a;border-radius:6px;padding:3px 8px;flex-shrink:0\">23n<\u002Fspan>\n      <span style=\"font-size:15px;font-weight:600;flex-shrink:0\">Питання не пішло — агент вимкнений<\u002Fspan>\n      <span style=\"font-size:13px;line-height:1.6;color:#838ba6;text-wrap:pretty\">Вхід у цей кадр один, і він справжній: <b style=\"color:#dde1ee;font-weight:600\">«СПИТАТИ ЩЕ РАЗ»<\u002Fb> на питанні, чийого агента відтоді вимкнули. Через поле сюди не втрапиш: коли наведений агент вимкнений, поле шите — «Агента вимкнено» і «Увімкніть агента в налаштуваннях», рука мертва; людину зупиняють до натиску й словом, і шитого поля не знімаємо — вимкнення зробила людина, тому сказати це до натиску чесніше, ніж пустити питання й сказати після. Кадр лишається, бо повтор відкриває ту саму діру наново: слова він бере із запису, за ідентифікатором питання (<a href=\"#23r\">23r<\u002Fa>), стоїть під старим ходом, а не біля поля, і стану адресата перед натиском не видно. Відправника за таким питанням немає — ні агента, ні лінії, тому «НЕ ПЕРЕДАЄ» (<a href=\"#4d\">4d<\u002Fa>) казати нема від кого. Слово: <b style=\"color:#dde1ee;font-weight:600\">«ПИТАННЯ НЕ ПІШЛО ⇢ EDITOR · ВИМКНЕНИЙ»<\u002Fb>. Форма — та сама, що в 4d, без відправника: пунктирна стрілка означає те, чого не сталось, а «ВИМКНЕНИЙ» — те саме слово, що в рядку лінії 4d, нового не заводимо. Родиною «хід не почався» (<a href=\"#4e\">4e<\u002Fa>) це не є: там у кожної причини свій крок у записі й своє слово кінця, а тут спроби не було зовсім — тому вихід той самий повтор (<a href=\"#23m\">23m<\u002Fa>), і саме тому вона не картка, а риска: застосунок тільки повідомляє (<a href=\"#4g\">4g<\u002Fa>). «СПИТАТИ ЩЕ РАЗ» тут читається «увімкнув і продовжив одним натиском»: слова беруться із запису (<a href=\"#23r\">23r<\u002Fa>), а не з поля. Випадок один — другий, «агент зайнятий», пішов разом із зайнятістю (29f): кілька ходів у агента буває лише в різних розмовах, а в одній розмові жива прогулянка одна й другого питання під ходьбу не надсилають зовсім (4h).<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"width:1280px;flex-shrink:0;background:#262b3a;background-image:radial-gradient(circle, rgba(255,255,255,0.14) 1px, transparent 1px);background-size:8px 8px;background-position:3px 3px;padding:35px;display:flex;gap:28px;box-sizing:border-box;border-radius:4px\">\n\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">ПОВТОР ПИТАННЯ · АГЕНТА ВІДТОДІ ВИМКНУЛИ<\u002Fspan>\n        <div style=\"width:380px;background:#12151f;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box\">\n          <div style=\"display:flex;align-items:center;gap:10px\">\n            <span style=\"flex:1;height:1px;background:#333a4d\"><\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490;white-space:nowrap\">НОВИЙ ЗАПИТ<\u002Fspan>\n            <span style=\"flex:1;height:1px;background:#333a4d\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <div style=\"display:flex;align-items:center;gap:7px\">\n              <span style=\"width:6px;height:6px;border-radius:50%;background:#dde1ee\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#dde1ee\">ВИ<\u002Fspan>\n              <span style=\"flex:1\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#5c6478\">10:47<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background:#171b26;border:1px solid #262b3a;border-radius:10px;padding:10px\">\n              <span style=\"font-size:12.5px;line-height:1.5;color:#dde1ee;text-wrap:pretty\">Перевір, чи міграція не зачепила індекси<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:7px;align-items:center;padding:2px 0;opacity:0.55\">\n            <div style=\"align-self:stretch;display:flex;align-items:center;gap:10px\">\n              <span style=\"flex:1;height:1px;background:#1c202c\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490;white-space:nowrap\">КРОК ОБІРВАВСЯ<\u002Fspan>\n              <span style=\"flex:1;height:1px;background:#1c202c\"><\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;border:1px solid #262b3a;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;color:#6b7490\">СПИТАТИ ЩЕ РАЗ · НАТИСНУЛИ 10:52<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:7px;align-items:center;padding:2px 0\">\n            <div style=\"align-self:stretch;display:flex;align-items:center;gap:10px\">\n              <span style=\"flex:1;height:1px;background:#1c202c\"><\u002Fspan>\n              <span style=\"display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490;white-space:nowrap\">\n                ПИТАННЯ НЕ ПІШЛО\n                <svg width=\"17\" height=\"8\" sc-camel-view-box=\"0 0 17 8\" fill=\"none\"><path d=\"M0 4h11\" stroke=\"#6b7490\" stroke-width=\"1.4\" stroke-dasharray=\"2.6 2.4\"><\u002Fpath><path d=\"M17 4 11 1.4v5.2Z\" fill=\"#6b7490\"><\u002Fpath><\u002Fsvg>\n                <span style=\"color:#b18aff\">EDITOR<\u002Fspan>\n                <span style=\"color:#4a5164\">·<\u002Fspan>\n                ВИМКНЕНИЙ\n              <\u002Fspan>\n              <span style=\"flex:1;height:1px;background:#1c202c\"><\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;border:1px solid #262b3a;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;color:#aab3cc\">\n              <svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6b7490\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6\"><\u002Fpath><\u002Fsvg>\n              СПИТАТИ ЩЕ РАЗ\n            <\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:1px;background:#1c202c\"><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:5px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ВХІД ОДИН — ПОВТОР СТАРОГО ХОДУ: ЧЕРЕЗ ПОЛЕ НЕ ВТРАПИШ, ПРИ ВИМКНЕНОМУ АДРЕСАТІ ВОНО ШИТЕ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ПОВТОР СТАНУ АДРЕСАТА НЕ БАЧИТЬ: ВІН СТОЇТЬ ПІД ХОДОМ, А НЕ БІЛЯ ПОЛЯ — ТОМУ ПРИЧИНА КАЖЕТЬСЯ ПО НАТИСКУ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ПИТАННЯ ЛИШАЄТЬСЯ В ПОТОЦІ Й У ЗАПИСІ — ВОНО ЛЯГЛО ТІЄЇ МИТІ, КОЛИ ЙОГО ПОСТАВИЛИ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">КРОКУ В ЗАПИСІ НЕМА, БО ХОДУ НЕ БУЛО: НІ ТОКЕНІВ, НІ ГРОШЕЙ, НІ СЛОВА КІНЦЯ (4e ЦЕ НЕ ВОНО)<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">РИСКА СТОЇТЬ У БЛОЦІ СВОГО ПИТАННЯ, ПІД ОСТАННІМ СКАЗАНИМ У НЬОМУ (<a href=\"#23m\">23m<\u002Fa>)<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">СТАН РЯДКА ІСТОРІЇ НЕ МІНЯЄТЬСЯ: ВІН ПРО ОСТАННІЙ ХІД, А ХОДУ ТУТ НЕ БУЛО<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">ЧОМУ НЕ ЧУЖИМИ СЛОВАМИ<\u002Fspan>\n        <div style=\"width:380px;background:#12151f;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box\">\n          <div style=\"display:flex;flex-direction:column;gap:7px\">\n            <div style=\"display:flex;align-items:center;gap:10px;opacity:0.5\">\n              <span style=\"flex:1;height:1px;background:#1c202c\"><\u002Fspan>\n              <span style=\"display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#6b7490;white-space:nowrap;text-decoration:line-through;text-decoration-color:#a9808a\">\n                НЕ ПЕРЕДАЄ ⇢ EDITOR · ВИМКНЕНИЙ\n              <\u002Fspan>\n              <span style=\"flex:1;height:1px;background:#1c202c\"><\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">НЕПРАВДА: НІХТО НІЧОГО НЕ ПЕРЕДАВАВ — У ПИТАННЯ ЛЮДИНИ НЕМА ВІДПРАВНИКА (4d)<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:7px\">\n            <div style=\"display:flex;align-items:center;gap:8px;background:#171b26;border:1px dashed #3a2a30;border-radius:10px;padding:10px;opacity:0.5\">\n              <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#a9808a\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"flex-shrink:0\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8v5M12 16.5h.01\"><\u002Fpath><\u002Fsvg>\n              <span style=\"flex:1;font-size:12.5px;font-weight:600;color:#a9808a;text-decoration:line-through;text-decoration-color:#a9808a\">Хід не почався<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#a9808a\">ВИМКНЕНИЙ<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">РОДИНА 4e ЗАКРИТА, І ВИМКНЕНОГО АГЕНТА СЕРЕД ЇЇ ПРИЧИН НЕМА<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">У КОЖНОЇ ЇЇ ПРИЧИНИ Є КРОК У ЗАПИСІ ЗІ СЛОВОМ КІНЦЯ — ТУТ СПРОБИ НЕ БУЛО ЗОВСІМ<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">КАРТКА ПОТРІБНА ТІЛЬКИ ТАМ, ДЕ Є ЩО ЛАГОДИТИ: ТУТ ЛАГОДИТИ НІЧОГО (4g)<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:1px;background:#1c202c\"><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:5px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ФОРМА — 4d БЕЗ ВІДПРАВНИКА: ПУНКТИРНА СТРІЛКА ОЗНАЧАЄ ТЕ, ЧОГО НЕ СТАЛОСЬ (41a)<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">«ВИМКНЕНИЙ» — ТЕ САМЕ СЛОВО, ЩО В РЯДКУ ЛІНІЇ 4d: НОВОГО НЕ ЗАВОДИМО<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ІМʼЯ АДРЕСАТА В РИСЦІ СВОЇМ КОЛЬОРОМ — БО ВИМКНЕНИЙ САМЕ ВІН, А НЕ РОЗМОВА<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#4a5164;line-height:1.7\">ВИПАДОК ОДИН: ДРУГИЙ, «АГЕНТ ЗАЙНЯТИЙ», ПІШОВ РАЗОМ ІЗ ЗАЙНЯТІСТЮ (29f); ДРУГЕ ПИТАННЯ ПІД ХОДЬБУ НЕ НАДСИЛАЮТЬ ЗОВСІМ (4h)<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"23t\" style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:baseline;gap:12px;max-width:1100px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:#38a3ff;background:#12151f;border:1px solid #262b3a;border-radius:6px;padding:3px 8px;flex-shrink:0\">23t<\u002Fspan><span style=\"font-size:15px;font-weight:600;flex-shrink:0\">Пошук показує знайдені місця · деталь <a href=\"#23a\">23a<\u002Fa><\u002Fspan><span style=\"font-size:13px;line-height:1.6;color:#838ba6;text-wrap:pretty\">Над списком один пошук, і плейсхолдер обіцяє дослівно, де він шукає: «Пошук по запиту, текстах і викликах». Правило одне й без винятків: <b style=\"color:#dde1ee;font-weight:600\">одне знайдене місце — один рядок<\u002Fb>. Слово шукають, щоб дійти туди, де воно сказане; запуск, що сказав його вісім разів, має вісім таких місць. Список <b style=\"color:#dde1ee;font-weight:600\">рівний і стоїть за годиною самого повідомлення<\u002Fb>, новіше згори, незалежно від запуску: груп на запуск немає — група ставала на час запуску, і запуск, що йшов годину, ховав свою найсвіжішу репліку під запуском, який скінчився ще до його початку. Рядок місця — <b style=\"color:#dde1ee;font-weight:600\">адреса одного повідомлення<\u002Fb>: ім'я агента своїм кольором ліворуч, «КРОК 6 · 14:27» тихим праворуч, знайдені слова під ними (<a href=\"#23x\">23x<\u002Fa>). Адресу запуску несе <b style=\"color:#dde1ee;font-weight:600\">тиха риска зміни<\u002Fb> — не група, а знак того, що попередній рядок був з іншого запуску: день, година й початок питання, нічого не переставляючи; один запуск може бути названий двічі, бо риска відповідає на «де я зараз», а не збирає рядки. Збіг у самому питанні має свій рядок і підписаний людиною — «ВИ» тим самим словом і кольором, що в потоці (<a href=\"#23k\">23k<\u002Fa>), з годиною питання й без кроку. Уривок починається з початку речення зі збігом і йде на два рядки з «…»; у виклику стоїть моно, бо речень у виводі немає. Стеля — триста місць, і ріже з правильного кінця: спершу весь список за годиною, потім триста найсвіжіших. Натиск веде не в початок запуску, а на те саме повідомлення (<a href=\"#23u\">23u<\u002Fa>). Щойно поле порожніє, список вертається до звичайних рядків запусків із темами й діями.<\u002Fspan><\u002Fdiv>\n<div style=\"width:1674px;flex-shrink:0;background:#262b3a;background-image:radial-gradient(circle, rgba(255,255,255,0.14) 1px, transparent 1px);background-size:8px 8px;background-position:3px 3px;padding:35px;display:flex;gap:28px;box-sizing:border-box;border-radius:4px;align-items:flex-start\"><div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#aab3cc\">РІВНИЙ СПИСОК · ЗА ГОДИНОЮ ПОВІДОМЛЕННЯ<\u002Fspan><div style=\"width:380px;background:#12151f;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-sizing:border-box\"><div style=\"display:flex;align-items:center;gap:8px;background:#171b26;border:1px solid #2c3550;border-radius:9px;padding:8px 10px;box-shadow:0 0 0 2px #38a3ff44\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5c6478\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m16.5 16.5 4 4\"><\u002Fpath><\u002Fsvg><span style=\"flex:1;font-size:12px;color:#dde1ee\">кеш<span style=\"display:inline-block;width:1px;height:12px;background:#38a3ff;margin-left:1px;vertical-align:-2px\"><\u002Fspan><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monos
