<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;gap:2px;background:#12151f;border:1px solid #1c202c;border-radius:10px;padding:6px;color:#838ba6;font-family:'IBM Plex Mono',monospace;font-size:11px">
  <span style="width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center">−</span>
  <span style="min-width:46px;text-align:center;letter-spacing:1px">{{ zoom }}</span>
  <span style="width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center">+</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:56},&quot;zoom&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;100%&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { zoom: this.props.zoom ?? "100%" };
  }
}
</script>
</body>
</html>
