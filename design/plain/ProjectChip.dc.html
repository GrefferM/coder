<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;gap:9px;background:#12151f;border:1px solid #262b3a;border-radius:9px;padding:7px 9px 7px 11px;box-shadow:0 6px 16px rgba(0,0,0,0.35)">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#838ba6" stroke-width="1.6" stroke-linejoin="round" style="flex-shrink:0"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
  <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
    <span style="font-size:12.5px;font-weight:500;color:#e6e9f2;white-space:nowrap">{{ label }}</span>
    <span style="font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;color:#4a5164;white-space:nowrap">{{ path }}</span>
  </div>
  <sc-if value="{{ dirty }}" hint-placeholder-val="{{ false }}">
    <span style="width:6px;height:6px;border-radius:50%;background:#38a3ff;flex-shrink:0"></span>
  </sc-if>
  <span style="flex:1"></span>
  <span style="width:22px;height:22px;border-radius:6px;background:{{ chevronBg }};display:flex;align-items:center;justify-content:center;flex-shrink:0">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="{{ chevronColor }}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ chevronPath }}"></path></svg>
  </span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:60},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;coder-app&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;path&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;/Users/olena/code/coder-app&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dirty&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const open = this.props.open ?? false;
    return {
      label: this.props.label ?? "coder-app",
      path: this.props.path ?? "/Users/olena/code/coder-app",
      dirty: this.props.dirty ?? false,
      chevronPath: open ? "m18 15-6-6-6 6" : "m6 9 6 6 6-6",
      chevronBg: open ? "#1b1f2c" : "transparent",
      chevronColor: open ? "#38a3ff" : "#5c6478",
    };
  }
}
</script>
</body>
</html>
