# How `npm run build:mac` packages the app: the compiled main process and the built renderer from dist/, the
# production dependencies beside them, and better-sqlite3 rebuilt for this Electron.
appId: com.grefferm.coder
productName: Coder
directories:
  output: release
files:
  - dist/**
  - "!dist/**/*.map"
  - package.json
# Coder Hearing, macOS's speech recognition, beside the app in its resources.
extraResources:
  - from: build/CoderHearing.app
    to: CoderHearing.app
extraMetadata:
  main: dist/app/main.js
mac:
  target:
    - target: dmg
      arch: arm64
  icon: src/app/assets/icon.png
  category: public.app-category.developer-tools
  # Signed ad hoc here; `scripts/pack-mac.js` names this machine's own identity where it holds one. Either is enough to
  # run on this machine, not to hand to another; the hardened runtime only matters to notarisation.
  identity: "-"
  hardenedRuntime: false
  # Coder Hearing lies inside Coder, so macOS asks Coder's own purposes for the speech and the microphone it uses.
  extendInfo:
    NSSpeechRecognitionUsageDescription: Щоб розпізнавати сказане на цій машині, без мережі.
    NSMicrophoneUsageDescription: Щоб чути питання, яке ви кажете агентам.
